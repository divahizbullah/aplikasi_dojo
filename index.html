${L?`<div class=grid><div class=card><h3>Profil kemampuan</h3>${radar(L,P)}<p class=note style="text-align:center">${P?'Garis penuh: evaluasi terakhir. Garis putus-putus: sebelumnya.':'Nilai dari evaluasi terakhir.'}</p></div><div class=card><h3>Nilai per aspek</h3>${ASP.filter(a=>+L[a[0]]>0).map(a=>{const v=+L[a[0]],dv=P&&+P[a[0]]>0?v-+P[a[0]]:null;return`<div class=ab><span>${a[1]}</span><div class=tr><i style="width:${v/5*100}%;background:${vc(v)}"></i></div><b>${v}</b><em style="color:${dv>0?'var(--ok)':dv<0?'#d32f2f':'var(--mut)'}">${dv==null?'':dv>0?'▲ '+dv:dv<0?'▼ '+Math.abs(dv):'='}</em></div>`}).join('')}</div></div>
<div class=card><h3>Tren nilai rata-rata</h3>${trend(evs)}</div>`:''}
<div class=card><div class=bar style="margin:0"><h3 class=g style="margin:0">Keterlibatan latihan</h3><button class="btn sm" onclick="go('jadwal')">Buka jadwal</button></div>${at.n?`<div style="display:flex;gap:16px;align-items:center;margin-top:12px;flex-wrap:wrap"><div class=rg style="width:96px;height:96px;background:conic-gradient(var(--acc) ${at.pct}%,var(--line) 0)"><div style="width:74px;height:74px;font-size:24px">${at.pct}%</div></div><div class=g style="min-width:200px"><div class=ev>${AS.map(([k,l])=>`<span class=bd>${l} ${at.c[k]}</span>`).join('')}</div><p style="margin:8px 0 0;font-size:14px">Hadir ${at.c.H} dari ${at.n} latihan yang diabsen.${at.streak>1?` 🔥 ${at.streak} latihan berturut-turut hadir.`:''}${at.c.A>=2?` ⚠ ${at.c.A} kali alpa.`:''}</p></div></div>
<h3 style="margin:16px 0 0;font-size:14px;color:var(--mut)">Kehadiran 6 bulan terakhir</h3><div class=mb>${at.mo.map(x=>`<div title="${x.h} hadir dari ${x.n} latihan"><i class="${x.n?'':'e'}" style="height:${x.n?Math.max(6,x.h/x.n*100):4}%"></i>${x.n?x.h+'/'+x.n:'-'}<span>${x.l}</span></div>`).join('')}</div>
<h3 style="margin:16px 0 4px;font-size:14px;color:var(--mut)">Latihan terakhir</h3>${at.rows.slice(-5).reverse().map(r=>`<div class=hb style="margin:6px 0"><span class=bd style="width:auto;background:${{H:'#2e7d32',I:'#2563eb',S:'#f59e0b',A:'#d32f2f'}[r.st]};color:${r.st=='S'?'#111':'#fff'};border:0">${AS.find(x=>x[0]==r.st)[1]}</span><span style="width:auto">${esc(r.title)}</span><span style="width:auto;color:var(--mut)">${fd(r.date)}</span></div>`).join('')}`:'<p class=emp>Belum ada data absensi. Isi absensi di menu Jadwal, nanti keterlibatan murid tampil di sini.</p>'}</div>
${rd?`<div class=card><div class=bar style="margin:0"><h3 class=g style="margin:0">Kesiapan UKT ke ${NEXT(s.belt)}</h3>${rd.all?'<span class=bd style="background:#16a34a;color:#fff;border:0">Siap</span>':rd.bad?'<span class=bd style="background:#d32f2f;color:#fff;border:0">Belum siap</span>':'<span class=bd>Data belum lengkap</span>'}</div><div style="margin-top:6px">${rd.c.map(x=>`<div class=ck2><i style="background:${x.ok===true?'#16a34a':x.ok===false?'#d32f2f':'var(--mut)'}">${x.ok===true?'✓':x.ok===false?'✕':'?'}</i><div class=g>${x.t}</div><b>${esc(x.v)}</b></div>`).join('')}</div>${rd.all&&!inU?`<button class="btn pri wide" onclick="addUkt('${s.id}')">Masukkan ke daftar UKT</button>`:inU?'<p class=tag style="margin:10px 0 0">✓ Sudah ada di daftar UKT</p>':''}<p class=note>Syarat ini hanya saran otomatis. Keputusan akhir tetap ada pada pelatih.</p></div>`:''}
<div class=card><div class=bar style="margin:0"><h3 class=g style="margin:0">Riwayat evaluasi</h3><button class="btn sm pri" onclick="evalForm('${s.id}')">+ Evaluasi</button></div>${evs.length?[...evs].reverse().map(e=>{const a=evAvg(e),q=GR(a*20);return`<div class=tl><div class=tlh><b>${fd(e.date)}</b><span class=bd style="background:${q[1]};color:${q[2]};border:0">${a.toFixed(1)} ${q[0]}</span><span class=g></span>${e.by?`<small style="display:inline">oleh ${esc(e.by)}</small>`:''}<button class="btn sm" aria-label="Hapus evaluasi" onclick="delEv('${e.id}')">✕</button></div><div class=chips2>${ASP.filter(x=>+e[x[0]]>0).map(x=>`<span class=ch2>${x[1]} <b style="color:${vc(+e[x[0]])}">${e[x[0]]}</b></span>`).join('')}</div>${e.note?`<small>${esc(e.note)}</small>`:''}${e.target?`<small>🎯 ${esc(e.target)}</small>`:''}</div>`}).join(''):'<p class=emp>Belum ada evaluasi. Catat penilaian pertama setelah latihan.</p>'}</div>
<div class=card><div class=bar style="margin:0"><h3 class=g style="margin:0">Riwayat sabuk</h3><button class="btn sm pri" onclick="promo('${s.id}')">Naik sabuk</button></div><div style="margin-top:8px">${[...s.hist].reverse().map(h=>`<div class=hb>${bd(h.belt)}<span style="width:auto;color:var(--mut)">${fd(h.date)}</span></div>`).join('')}</div></div>
<div class=card><h3>Prestasi</h3>${ac.length?ac.map(a=>`<div class=hb><i style="width:14px;background:${MC[a.medal]}"></i>${MD[a.medal]}, ${esc(a.champ)} (${a.level}, ${a.cat} ${esc(a.cls)}, ${a.year})</div>`).join(''):'<p class=emp>Belum ada prestasi tercatat.</p>'}</div>
<details class=card><summary>Biodata lengkap</summary><div class=grid style="margin-top:12px;gap:8px;font-size:14px"><div><small>Tempat, tanggal lahir</small>${esc(s.pob)}, ${fd(s.dob)} (${age(s.dob)} th)</div><div><small>Jenis kelamin</small>${s.sex}</div><div><small>No. HP</small>${esc(s.phone)}</div><div><small>Bergabung</small>${fd(s.join)}</div><div><small>Alamat</small>${esc(s.addr)||'-'}</div></div></details>`}
function delStu(id){if(!confirm('Hapus murid ini beserta catatannya?'))return;const d=D();d.students=d.students.filter(s=>s.id!=id);d.eval=d.eval.filter(e=>e.sid!=id);d.ach=d.ach.filter(a=>a.sid!=id);d.events.forEach(e=>e.entries=e.entries.filter(x=>x.sid!=id));d.ukt.sel=d.ukt.sel.filter(x=>x!=id);Object.values(d.att||{}).forEach(a=>delete a[id]);save();SID=null;draw()}
function promo(id){const s=stu(id);if(s.belt=='Hitam'){}modal('Naik sabuk',F('belt','Sabuk baru',BELTS[Math.min(BELTS.indexOf(s.belt)+1,BELTS.length-1)],0,BELTS)+F('date','Tanggal kenaikan',today(),'date'),f=>{s.belt=f.belt;s.hist.push({belt:f.belt,date:f.date});save();draw()})}
function evalForm(id){const sc=a=>`<label>${a[1]} <small style="display:inline;font-weight:400">${a[2]}</small><div class=sc>${[1,2,3,4,5].map(i=>`<label><input type=radio name=${a[0]} value=${i} ${i==3?'checked':''}><span>${i}</span></label>`).join('')}</div></label>`;
modal('Evaluasi latihan',F('date','Tanggal',today(),'date')+'<p class=note style="margin:8px 0 0">Skala 1 sampai 5: 1 perlu bimbingan, 2 kurang, 3 cukup, 4 baik, 5 sangat baik.</p>'+ASP.map(sc).join('')+`<label>Catatan perkembangan<textarea name=note rows=3 placeholder="Contoh: kuda-kuda sudah stabil, perlu latihan kecepatan"></textarea></label><label>Target latihan berikutnya<textarea name=target rows=2 placeholder="Contoh: fokus Heian Godan dan kondisi fisik"></textarea></label>`,f=>{const me=S.users.find(u=>u.id==ses.uid);D().eval.push({id:uid(),sid:id,...f,by:me?me.name:''});save();draw()})}

/* PRESTASI */
function prestasi(){const d=D(),yrs=[...new Set(d.ach.map(a=>a.year))].sort().reverse(),r=d.ach.filter(a=>(!PF.y||a.year==PF.y)&&(!PF.l||a.level==PF.l)),cnt=m=>r.filter(a=>a.medal==m).length;
const pts={};r.forEach(a=>{pts[a.sid]=pts[a.sid]||{p:0,m:[0,0,0,0]};pts[a.sid].p+=4-a.medal;pts[a.sid].m[a.medal]++});const top=Object.entries(pts).sort((a,b)=>b[1].p-a[1].p).slice(0,5);
return`<div class=bar><h2 class=g>Prestasi</h2><button class="btn pri" onclick="achForm()">+ Tambah prestasi</button></div><div class=bar><select style="flex:1;width:auto" onchange="PF.y=this.value;draw()"><option value="">Semua tahun</option>${yrs.map(y=>`<option ${PF.y==y?'selected':''}>${y}</option>`).join('')}</select><select style="flex:1;width:auto" onchange="PF.l=this.value;draw()"><option value="">Semua tingkat</option>${LV.map(l=>`<option ${PF.l==l?'selected':''}>${l}</option>`).join('')}</select></div>
<div class=kpis>${[1,2,3].map(m=>`<div class=kpi style="background:${MC[m]}"><b>${cnt(m)}</b><span>${MD[m]}</span></div>`).join('')}</div>
<div class=card><h3>Atlet paling berprestasi</h3>${top.length?top.map(([id,v],i)=>`<div class=row onclick="V='murid';SID='${id}';draw()">${av(stu(id))}<div class=g><b>${i+1}. ${esc(stu(id).name)}</b><small>${v.m[1]} emas, ${v.m[2]} perak, ${v.m[3]} perunggu</small></div><b>${v.p} poin</b></div>`).join(''):'<p class=emp>Belum ada prestasi pada filter ini.</p>'}</div>
<div class=card style="padding:4px"><h3 style="padding:12px 12px 0">Daftar prestasi</h3>${r.sort((a,b)=>b.year-a.year).map(a=>`<div class=row style="cursor:default"><i style="width:14px;height:14px;border-radius:50%;background:${MC[a.medal]};flex:none"></i><div class=g><b>${esc(stu(a.sid).name)}</b><small>${esc(a.champ)}, ${a.level}, ${a.cat} ${esc(a.cls)}, ${a.year}</small></div>${adm()?`<button class="btn sm" onclick="D().ach=D().ach.filter(x=>x.id!='${a.id}');save();draw()">Hapus</button>`:''}</div>`).join('')||'<p class=emp>Belum ada data.</p>'}</div>`}
const sOpts=()=>D().students.filter(s=>s.status=='Aktif').map(s=>[s.id,s.name+' ('+s.belt+')']);
function achForm(){if(!D().students.length)return alert('Tambahkan murid terlebih dulu.');
modal('Tambah prestasi',F('sid','Murid',0,0,sOpts()).replace('<select name=sid>','<select name=sid onchange="achEv()">')+`<label>Kejuaraan yang diikuti<select name=evid onchange="achPick()"></select></label><p class=note style="margin:4px 0 0">Daftar kejuaraan diambil dari menu Kejuaraan (murid yang sudah didaftarkan).</p><div id=achman style="display:none">${F('champ','Nama kejuaraan')}${F('level','Tingkat','Cabang',0,LV)}</div><div class=two>${F('cat','Kategori','Kumite',0,['Kata','Kumite'])}${F('cls','Kelas berat / usia')}</div><div class=two>${F('medal','Peringkat',1,0,[[1,'Juara 1 (Emas)'],[2,'Juara 2 (Perak)'],[3,'Juara 3 (Perunggu)']])}${F('year','Tahun',new Date().getFullYear(),'number')}</div>`,f=>{let champ=f.champ,level=f.level;if(f.evid&&f.evid!='_'){const[ei]=f.evid.split('|'),e=D().events.find(x=>x.id==ei);if(!e)return;champ=e.name;level=e.level}else if(!champ)return alert('Nama kejuaraan wajib diisi.');D().ach.push({id:uid(),sid:f.sid,champ,level,cat:f.cat,cls:f.cls||'',medal:+f.medal,year:+f.year});save();draw()});achEv()}
function achEv(){const f=$('#mf').elements,o=[];D().events.forEach(e=>e.entries.forEach((x,i)=>{if(x.sid==f.sid.value)o.push([e.id+'|'+i,e.name+', '+x.cat])}));o.push(['_','Kejuaraan lain (ketik manual)']);f.evid.innerHTML=o.map(x=>`<option value="${esc(x[0])}">${esc(x[1])}</option>`).join('');achPick()}
function achPick(){const f=$('#mf').elements,v=f.evid.value;$('#achman').style.display=v=='_'?'block':'none';if(v=='_')return;const[ei,i]=v.split('|'),e=D().events.find(x=>x.id==ei),x=e&&e.entries[+i];if(!x)return;const m=x.cat.match(/^(Kata Perorangan|Kata Beregu|Kata|Kumite)\s*(.*)$/);if(m){f.cat.value=/^Kata/.test(m[1])?'Kata':'Kumite';f.cls.value=m[2]}f.year.value=e.date.slice(0,4)}
/* KEJUARAAN */
const ST=['Belum siap','Siap','Terdaftar'];
function event(){const d=D();if(EID){const e=d.events.find(x=>x.id==EID);return`<div class=bar><button class="btn sm" onclick="EID=null;draw()">← Kembali</button><span class=g></span>${adm()?`<button class="btn sm" onclick="D().events=D().events.filter(x=>x.id!='${e.id}');EID=null;save();draw()">Hapus acara</button>`:''}</div><div class=card><h3>${esc(e.name)}</h3><small>${fd(e.date)}, ${esc(e.place)}, tingkat ${e.level}</small><div class=ev style="margin-top:8px"><span class=bd>${e.entries.length} atlet</span><span class=bd>${e.entries.filter(x=>x.status=='Terdaftar').length} terdaftar</span><span class=bd>${e.entries.filter(x=>x.status=='Siap').length} siap</span></div></div><div class=bar><h3 class=g>Kontingen</h3><button class="btn pri sm" onclick="entForm('${e.id}')">+ Daftarkan murid</button></div><div class=card style="padding:4px">${e.entries.map((x,i)=>`<div class=row style="cursor:default">${av(stu(x.sid))}<div class=g><b>${esc(stu(x.sid).name)}</b><small>${esc(x.cat)}</small></div><select style="width:auto;min-height:36px" onchange="D().events.find(y=>y.id=='${e.id}').entries[${i}].status=this.value;save();draw()">${ST.map(t=>`<option ${t==x.status?'selected':''}>${t}</option>`).join('')}</select><button class="btn sm" aria-label="Hapus" onclick="D().events.find(y=>y.id=='${e.id}').entries.splice(${i},1);save();draw()">✕</button></div>`).join('')||'<p class=emp>Belum ada atlet. Daftarkan murid dari database dojo.</p>'}</div>`}
return`<div class=bar><h2 class=g>Kejuaraan</h2><button class="btn pri" onclick="evForm()">+ Tambah kejuaraan</button></div>${[...d.events].sort((a,b)=>a.date>b.date?1:-1).map(e=>`<div class="card row" tabindex=0 onclick="EID='${e.id}';draw()" style="margin-bottom:10px"><div class=g><b>${esc(e.name)}</b><small>${fd(e.date)}, ${esc(e.place)}</small></div><span class=bd>${e.level}</span><span class=bd>${e.entries.length} atlet</span></div>`).join('')||'<p class=emp>Belum ada kejuaraan. Tambahkan agenda yang akan diikuti dojo.</p>'}`}
function evForm(){modal('Tambah kejuaraan',F('name','Nama kejuaraan')+`<div class=two>${F('date','Tanggal',today(),'date')}${F('level','Tingkat','Cabang',0,LV)}</div>`+F('place','Lokasi'),f=>{if(!f.name)return;D().events.push({id:uid(),...f,entries:[]});save();draw()})}
function entForm(eid){modal('Daftarkan murid',F('sid','Murid',0,0,sOpts())+F('cat','Kategori pertandingan','Kumite',0,['Kata Perorangan','Kata Beregu','Kumite'])+F('cls','Kelas berat / usia (opsional)')+F('status','Status','Belum siap',0,ST),f=>{const e=D().events.find(x=>x.id==eid);if(e.entries.some(x=>x.sid==f.sid&&x.cat==f.cat))return alert('Murid sudah terdaftar di kategori ini.');e.entries.push({sid:f.sid,cat:(f.cat+' '+f.cls).trim(),status:f.status});save();draw()})}
/* UKT */
const BI=b=>BELTS.indexOf(b);
const TB=s=>{const t=((D().ukt||{}).tg||{})[s.id];return t&&BELTS.includes(t)?t:NEXT(s.belt)};
const prest=s=>{const y=new Date().getFullYear();return D().ach.filter(a=>a.sid==s.id&&a.year>=y-1).length};
const ukey=u=>u.period+'|'+u.date;
function uFt(){const q=UQ.q.trim().toLowerCase();return D().students.filter(s=>s.status=='Aktif'&&(!q||(s.name+' '+s.nia).toLowerCase().includes(q))&&(!UQ.belt||s.belt==UQ.belt))}
function uchips(){const base=D().students.filter(s=>s.status=='Aktif');return [['','Semua',base.length],...BELTS.map(b=>[b,b,base.filter(s=>s.belt==b).length])].map(x=>`<button class="chp ${UQ.belt==x[0]?'on':''}" onclick="UQ.belt='${x[0]}';draw()">${x[0]?`<i style="background:${BC[x[0]]}"></i>`:''}${x[1]} <b>${x[2]}</b></button>`).join('')}
function uRow(s){const u=D().ukt,on=u.sel.includes(s.id),n=prest(s),i=BI(s.belt),tj=TB(s);let r;
if(s.belt=='Hitam')r='<small style="display:inline">Dan: tidak diproses otomatis</small>';
else if(on){const o=[BELTS[i+1],BELTS[i+2]].filter(Boolean);r=`<select style="width:auto;min-height:36px" aria-label="Sabuk tujuan ${esc(s.name)}" onchange="setTg('${s.id}',this.value)">${o.map((b,k)=>`<option value="${b}" ${b==tj?'selected':''}>${b}${k?' (naik 2 tingkat)':''}</option>`).join('')}</select>`}
else r=bd(NEXT(s.belt));
return`<div class=row style="cursor:default;flex-wrap:wrap"><label style="display:flex;gap:12px;align-items:center;flex:1;min-width:200px;margin:0;color:var(--ink);font-weight:400;cursor:pointer"><input type=checkbox class=ck ${on?'checked':''} onchange="tg('${s.id}')">${av(s)}<div class=g><b>${esc(s.name)}</b><small>${esc(s.nia)}${n?', 🏅 berprestasi ('+n+' medali)':''}</small></div></label>${bd(s.belt)}<span style="color:var(--mut)">→</span>${r}</div>`}
function uList(){const r=uFt();return r.length?r.map(uRow).join(''):'<p class=emp>Tidak ada murid yang cocok. Ubah pencarian atau filter sabuk.</p>'}
function ucnt(){const c=$('#ucnt');if(c)c.textContent=uFt().length+' dari '+D().students.filter(s=>s.status=='Aktif').length+' murid aktif'}
function uInfo(){const u=D().ukt,n=u.sel.length;
if(u.last&&u.done==ukey(u))return`<p class=tag style="margin:10px 0 0">✓ Kenaikan sabuk sudah diproses (${fd(u.last.date)}, ${u.last.n} murid). Ubah tanggal ujian untuk UKT berikutnya.</p>`;
if(u.date)return`<p style="margin:10px 0 0;font-size:14px">🔔 Pada <b>${fd(u.date)}</b>, ${n} murid terpilih akan <b>naik sabuk otomatis</b> sesuai sabuk tujuan. Murid berprestasi (🏅) bisa langsung dinaikkan 2 tingkat dengan mengubah "Sabuk tujuan" di daftar peserta.</p>${n?'<button class="btn sm" style="margin-top:8px" onclick=runNow()>Proses kenaikan sekarang</button>':''}`;
return'<p class=note>Isi tanggal ujian. Murid yang dipilih akan naik sabuk otomatis pada tanggal tersebut.</p>'}
function ukt(){const u=D().ukt,n=u.sel.length;
return`<h2 style="margin-bottom:12px">Persiapan UKT</h2><div class=card><div class=two>${F('p','Nama periode',u.period).replace('name=p','name=p oninput="D().ukt.period=this.value;save()"')}${F('dt','Tanggal ujian',u.date,'date').replace('name=dt','name=dt onchange="uktDate(this.value)"')}</div>${uInfo()}</div>
<div class=bar><span class=g><b>${n}</b> murid dipilih</span><button class="btn sm" onclick="uAll()">Pilih semua yang tampil</button><button class="btn sm" onclick="D().ukt.sel=[];D().ukt.tg={};save();draw()">Kosongkan</button><button class="btn pri" onclick="exp()" ${n?'':'disabled style="opacity:.5"'}>Ekspor Data UKT ke Excel (.xlsx)</button></div>

function runUkt(){const d=D(),u=d.ukt,dt=u.date&&u.date<=today()?u.date:today(),L=[];

function aAll(id){const a=ga(id);jFt().forEach(s=>{if(!a[s.id])a[s.id]='H'});save();aRef(id)}
function aClr(id){if(!confirm('Hapus absensi murid yang tampil di daftar ini?'))return;const a=ga(id);jFt().forEach(s=>delete a[s.id]);save();aRef(id)}

<div class=card><h3>${esc(e.title)}</h3><small>${dow(e.date)}, ${fd(e.date)}, ${esc(e.start)} - ${esc(e.end)}${e.place?', '+esc(e.place):''}</small>${e.note?`<small>${esc(e.note)}</small>`:''}<div id=asum class=ev style="margin-top:8px">${asum(e.id)}</div></div>
<div class=bar><div class=sb2><span aria-hidden=true>🔍</span><input type=search placeholder="Cari nama atau NIA" aria-label="Cari murid" value="${esc(JQ.q)}" oninput="JQ.q=this.value;aRef('${e.id}')"></div><button class=btn onclick="aAll('${e.id}')">Tandai sisanya hadir</button><button class=btn onclick="aClr('${e.id}')">Kosongkan</button></div><div class=chips>${jchips()}</div><small id=jcnt style="margin:0 0 8px">${jFt().length} dari ${D().students.filter(s=>s.status=='Aktif').length} murid aktif</small>
<div class=card id=alst style="padding:4px">${alist(e.id)}</div><p class=note>H = Hadir, I = Izin, S = Sakit, A = Alpa. Klik lagi tombol yang aktif untuk menghapus pilihan. Daftar murid diambil dari menu Murid (yang berstatus Aktif).</p>`}
/* IMPOR MURID DARI EXCEL */
const TPL=['NIA','Nama Lengkap','Tempat Lahir','Tanggal Lahir','Jenis Kelamin','Sabuk Saat Ini','Alamat','No. HP / WhatsApp','Tanggal Bergabung','Status'];
const AL={nia:['nia','nomorindukanggota','noinduk'],nama:['namalengkap','nama','name'],pob:['tempatlahir','tempat','tmplahir'],dob:['tanggallahir','tgllahir'],sex:['jeniskelamin','jk','gender','kelamin'],belt:['sabuksaatini','sabuk','tingkat','tingkatsekarang','sabuksekarang'],addr:['alamat'],phone:['nohpwhatsapp','nohp','hp','whatsapp','telepon','nomorhp','nohpwa'],join:['tanggalbergabung','tglbergabung','bergabung'],status:['status']};
const nk=h=>String(h||'').toLowerCase().replace(/[^a-z]/g,'');
let IMP=[];
async function saveWb(wb,fn){const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});try{const dl=window.claude&&await claude.use('downloads');if(dl)return await dl.save({filename:fn,data:buf})}catch(e){if(e&&e.code=='declined')return}XLSX.writeFile(wb,fn)}
async function tplDl(){const ex=['','Contoh: Budi Santoso','Depok','15-03-2012','Laki-laki','Kuning','Jl. Mawar No. 5','081234567890','10-01-2024','Aktif'];const ws=XLSX.utils.aoa_to_sheet([TPL,ex]);ws['!cols']=[12,26,16,16,15,16,30,20,18,12].map(w=>({wch:w}));
const info=[['Petunjuk pengisian'],['Timpa atau hapus baris contoh, lalu isi data murid mulai baris 2.'],['Wajib diisi: Nama Lengkap. Kolom lain boleh kosong.'],['NIA kosong = dibuatkan otomatis.'],['Tanggal ditulis hari-bulan-tahun, contoh 31-12-2012.'],['Jenis Kelamin: Laki-laki atau Perempuan.'],['Sabuk Saat Ini: '+BELTS.join(', ')+' (kosong = Putih).'],['Status: Aktif atau Non-aktif (kosong = Aktif).'],['Murid dengan NIA sama, atau nama dan tanggal lahir sama, dianggap sudah ada.']];
const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Murid');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(info),'Petunjuk');await saveWb(wb,'Template_Murid_DojoFlow.xlsx')}
function pd(v){const t=String(v==null?'':v).trim();if(!t)return'';let m=t.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/);if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');if(/^\d{5}$/.test(t))return new Date(Math.round((+t-25569)*864e5)).toISOString().slice(0,10);return null}
function pb(v){const t=String(v||'').trim().toLowerCase();if(!t)return'Putih';const m=t.match(/kyu\s*(\d)/);if(m){const b=Object.keys(KYUN).find(k=>KYUN[k]=='Kyu '+m[1]);if(b)return b}if(/strip/.test(t))return'Coklat Strip';if(/cokelat|coklat/.test(t))return'Coklat';for(const b of['Putih','Kuning','Oranye','Hijau','Biru','Hitam'])if(t.includes(b.toLowerCase()))return b;return/\bdan\b/.test(t)?'Hitam':null}
function ps(v){const t=String(v||'').trim().toLowerCase();if(!t)return'';if(/^(l|laki|pria|male|m)/.test(t))return'Laki-laki';if(/^(p|perempuan|wanita|female|f)/.test(t))return'Perempuan';return''}
function impUI(){$('#m').innerHTML='<div class=ov><div class=mo><div class=mh>Impor murid dari Excel<button class=x aria-label="Tutup" onclick=cm()>✕</button></div><div id=impb></div></div></div>';impStep1()}
function impStep1(msg){$('#impb').innerHTML=`${msg?`<p class=warn>${msg}</p>`:''}<ol style="padding-left:20px;line-height:1.7;margin:8px 0"><li>Unduh template Excel.</li><li>Isi data murid sesuai kolom di template.</li><li>Unggah file di bawah, lalu cek hasilnya sebelum diimpor.</li></ol><button class=btn onclick=tplDl()>⬇ Unduh template Excel</button><label class=drop ondragover="event.preventDefault();this.classList.add('on')" ondragleave="this.classList.remove('on')" ondrop="event.preventDefault();impFile(event.dataTransfer.files[0])"><b>Tarik file ke sini</b><br><span style="color:var(--mut)">atau klik untuk memilih file (.xlsx, .xls, .csv)</span><input type=file accept=".xlsx,.xls,.csv" onchange="impFile(this.files[0])"></label>`}
function impFile(f){if(!f)return;f.arrayBuffer().then(b=>{let a;try{const wb=XLSX.read(b,{type:'array',cellDates:true,dateNF:'yyyy-mm-dd'});a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,dateNF:'yyyy-mm-dd',defval:''})}catch(e){return impStep1('File tidak bisa dibaca. Gunakan file Excel atau CSV.')}
const H=(a[0]||[]).map(nk),ix={};for(const k in AL)ix[k]=H.findIndex(h=>AL[k].includes(h));if(ix.nama<0)return impStep1('Kolom "Nama Lengkap" tidak ditemukan. Gunakan template dari tombol di bawah.');
const d=D(),seen={};IMP=[];a.slice(1).forEach((r,i)=>{if(!r.some(c=>String(c).trim()))return;const n=i+2,g=k=>ix[k]<0?'':String(r[ix[k]]==null?'':r[ix[k]]).trim(),name=g('nama');
if(!name)return IMP.push({k:'err',n,m:'Nama lengkap kosong'});const belt=pb(g('belt'));if(!belt)return IMP.push({k:'err',n,m:name+': sabuk "'+g('belt')+'" tidak dikenal'});const dob=pd(g('dob')),jn=pd(g('join'));if(dob===null||jn===null)return IMP.push({k:'err',n,m:name+': format tanggal tidak dikenal (pakai 31-12-2012)'});
let ph=g('phone');if(/^8\d{8,12}$/.test(ph))ph='0'+ph;const v={nia:g('nia'),name,pob:g('pob'),dob,sex:ps(g('sex')),addr:g('addr'),phone:ph,join:jn||today(),status:/^(non|tidak)/i.test(g('status'))?'Non-aktif':'Aktif',belt},key=v.nia||name.toLowerCase()+'|'+dob;
if(seen[key])return IMP.push({k:'err',n,m:name+': duplikat di dalam file'});seen[key]=1;const ex=d.students.find(s=>(v.nia&&s.nia==v.nia)||(s.name.toLowerCase()==name.toLowerCase()&&(s.dob||'')==dob));IMP.push({k:ex?'up':'new',n,v,ex})});
if(!IMP.length)return impStep1('Tidak ada baris data di file. Isi data mulai baris ke-2.');impStep2()})}
function impStep2(){const R=IMP,nw=R.filter(r=>r.k=='new').length,up=R.filter(r=>r.k=='up').length,er=R.filter(r=>r.k=='err');
$('#impb').innerHTML=`<div class=kpis style="grid-template-columns:repeat(3,1fr)"><div class=kpi><b>${nw}</b><span>Baru</span></div><div class=kpi><b>${up}</b><span>Sudah ada</span></div><div class=kpi><b>${er.length}</b><span>Dilewati</span></div></div>${up?`<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type=checkbox id=updx class=ck checked>Perbarui data ${up} murid yang sudah ada</label>`:''}${er.length?`<div class=card style="padding:10px;margin:10px 0"><b class=warn>Baris yang dilewati</b>${er.slice(0,6).map(r=>`<small>Baris ${r.n}: ${esc(r.m)}</small>`).join('')}${er.length>6?`<small>dan ${er.length-6} lainnya</small>`:''}</div>`:''}<div class=card style="padding:4px;margin:10px 0;max-height:200px;overflow:auto">${R.filter(r=>r.k!='err').slice(0,8).map(r=>`<div class=row style="cursor:default;padding:8px"><div class=g><b>${esc(r.v.name)}</b><small>${r.k=='up'?'Perbarui data':'Murid baru'}</small></div>${bd(r.v.belt)}</div>`).join('')||'<p class=emp>Tidak ada data yang bisa diimpor.</p>'}</div><div class=bar><button class=btn onclick=impStep1()>Pilih file lain</button><button class="btn pri g" onclick=impGo() ${nw+up?'':'disabled'}>Impor murid</button></div>`}
function impGo(){const d=D(),upd=!$('#updx')||$('#updx').checked;let nw=0,up=0,c=d.students.length;
IMP.forEach(r=>{if(r.k=='new'){let nia=r.v.nia;if(!nia){do{c++;nia='NIA-'+String(c).padStart(3,'0')}while(d.students.some(s=>s.nia==nia))}d.students.push({id:uid(),...r.v,nia,photo:'',hist:[{belt:r.v.belt,date:r.v.join}]});nw++}
else if(r.k=='up'&&upd){const s=r.ex,v=r.v;['pob','dob','sex','addr','phone','status'].forEach(k=>{if(v[k])s[k]=v[k]});if(v.belt!=s.belt){s.belt=v.belt;s.hist.push({belt:v.belt,date:today()})}up++}});
save();cm();Q.q='';Q.belt='';Q.st='Aktif';draw();toast(nw+' murid ditambahkan, '+up+' diperbarui')}

try{const r=JSON.parse(localStorage.getItem('dojoflow_ses')||'null');if(r&&r.uid){const u=S.users.find(x=>x.id==r.uid&&S.data[x.dojo]&&S.dojos.some(j=>j.id==x.dojo));if(u)ses={dojo:u.dojo,role:u.role,uid:u.id}}}catch(e){}

function eyes(){document.querySelectorAll('input[type=password]').forEach(i=>{if(i.parentNode.classList.contains('pw'))return;const w=document.createElement('span');w.className='pw';i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='eye';b.innerHTML=EYE;b.setAttribute('aria-label','Tampilkan kata sandi');b.setAttribute('aria-pressed','false');b.onclick=()=>{const sh=i.type=='password';i.type=sh?'text':'password';b.innerHTML=sh?EYEX:EYE;b.setAttribute('aria-label',sh?'Sembunyikan kata sandi':'Tampilkan kata sandi');b.setAttribute('aria-pressed',String(sh));i.focus()};w.appendChild(b)})}
new MutationObserver(eyes).observe(document.body,{childList:true,subtree:true});
draw();
