<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#14213d;--mut:#64708a;--line:#e1e6ee;--navy:#14213d;--acc:#e63a1e;--accs:#fde8e3;--ok:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1424;--card:#16203a;--ink:#e8ecf5;--mut:#93a0bd;--line:#26335a;--navy:#0a1020;--accs:#3a1a16;--ok:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1424;--card:#16203a;--ink:#e8ecf5;--mut:#93a0bd;--line:#26335a;--navy:#0a1020;--accs:#3a1a16;--ok:#4ade80;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,system-ui,sans-serif;padding-bottom:70px}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;letter-spacing:.2px;margin:0}
h2{font-size:26px}h3{font-size:19px}
header{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font:700 20px 'Barlow Condensed',Impact,sans-serif}header .g{flex:1;min-width:0}header small{display:block;opacity:.7;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{width:34px;height:34px;border-radius:8px;background:var(--acc);display:grid;place-items:center;font:700 20px 'Barlow Condensed';color:#fff}
.chip{background:rgba(255,255,255,.14);padding:3px 10px;border-radius:99px;font-size:12px}
main{max-width:980px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}

nav button.on{color:var(--acc);border-top-color:var(--acc)}
@media(min-width:820px){body{padding:0 0 0 190px}header{margin-left:-190px;padding-left:206px}nav{top:57px;bottom:0;right:auto;width:190px;flex-direction:column;border-top:0;border-right:1px solid var(--line);justify-content:flex-start;padding-top:10px}nav button{text-align:left;padding:12px 20px;font-size:15px;border-top:0;border-left:3px solid transparent}nav button.on{border-left-color:var(--acc)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

.kpi{background:var(--navy);color:#fff;border-radius:12px;padding:14px}.kpi b{display:block;font:700 38px/1 'Barlow Condensed'}.kpi span{font-size:13px;opacity:.8}.kpi.a{background:var(--acc)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;border-radius:9px;font:600 15px Barlow,sans-serif;cursor:pointer;min-height:44px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn.dk{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.sm{min-height:34px;padding:5px 12px;font-size:13px}.btn.wide{width:100%;margin-top:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}.bar .g{flex:1}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;min-height:44px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-top:10px}label input,label select,label textarea{margin-top:4px;color:var(--ink);font-weight:400}
.row{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.row:last-child{border:0}.row .g{flex:1;min-width:0}.row small,small{color:var(--mut);display:block}
.av{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;flex:none;object-fit:cover;border:3px solid}

.hb{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.hb i{height:18px;border-radius:4px;min-width:4px;border:1px solid var(--line)}.hb span{width:56px}
.dn{width:130px;height:130px;border-radius:50%;flex:none;display:grid;place-items:center}.dn div{width:80px;height:80px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:700 26px 'Barlow Condensed'}

.ov{position:fixed;inset:0;background:rgba(5,10,25,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}.mo{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}@media(min-width:600px){.ov{align-items:center}.mo{border-radius:16px}}
.mh{display:flex;justify-content:space-between;align-items:center;font:700 22px 'Barlow Condensed'}.x{border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer;min-width:44px;min-height:44px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{display:flex;gap:4px}.sc label{margin:0;flex:1}.sc input{display:none}.sc span{display:block;text-align:center;padding:9px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--ink);font-weight:600}.sc input:checked+span{background:var(--acc);color:#fff;border-color:var(--acc)}
.tag{color:var(--ok);font-weight:600}.warn{color:var(--acc);font-weight:600}
.login{max-width:460px;margin:0 auto;padding:28px 16px}.login .hero{background:var(--navy);color:#fff;border-radius:14px;padding:24px;margin-bottom:16px}.login .hero h1{font-size:40px;line-height:1}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.ck{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--acc)}
.ev{display:flex;gap:6px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="app"></div><div id="m"></div>
<script>
const BELTS=['Putih','Kuning','Hijau','Biru','Coklat','Hitam'];
const BC={Putih:'#f1f5f9',Kuning:'#facc15',Hijau:'#16a34a',Biru:'#2563eb',Coklat:'#92400e',Hitam:'#0f172a'};
const NEXT=b=>BELTS[BELTS.indexOf(b)+1]||'Dan berikutnya';
const LV=['Dojo','Cabang','Provinsi','Nasional','Internasional'],MD={1:'Emas',2:'Perak',3:'Perunggu'},MC={1:'#eab308',2:'#94a3b8',3:'#b45309'};
const K='dojoflow-v2';const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const fd=s=>s?s.split('-').reverse().join('/'):'';
const age=d=>d?Math.floor((Date.now()-new Date(d))/31557600000):'-';
const today=()=>new Date().toISOString().slice(0,10);
function seed(){
 const st=(n,nia,name,pob,dob,sex,belt,join)=>({id:uid(),nia,name,pob,dob,sex,addr:'',phone:'0812'+(1000000+n*7919),join,status:'Aktif',belt,photo:'',hist:BELTS.slice(0,BELTS.indexOf(belt)+1).map((b,i)=>({belt:b,date:(parseInt(join)+i)+'-'+(i%2?'06':'12')+'-14'}))});
 const a=[st(1,'HP-001','Raka Pratama','Depok','2011-03-12','Laki-laki','Hijau','2019-01-10'),st(2,'HP-002','Salsabila Putri','Jakarta','2012-07-21','Perempuan','Biru','2018-07-02'),st(3,'HP-003','Dimas Wicaksono','Bogor','2009-11-05','Laki-laki','Coklat','2016-02-15'),st(4,'HP-004','Aulia Rahma','Depok','2013-01-30','Perempuan','Kuning','2023-01-08'),st(5,'HP-005','Fikri Maulana','Depok','2014-05-18','Laki-laki','Putih','2025-08-20'),st(6,'HP-006','Nadia Kusuma','Bekasi','2010-09-09','Perempuan','Hijau','2020-03-01'),st(7,'HP-007','Bagas Setiawan','Depok','2000-04-02','Laki-laki','Hitam','2012-05-05'),st(8,'HP-008','Intan Permata','Depok','2015-12-25','Perempuan','Putih','2026-01-12')];
 const b=[st(1,'GN-001','Yoga Aditya','Bandung','2010-02-02','Laki-laki','Biru','2018-01-01'),st(2,'GN-002','Citra Lestari','Cimahi','2012-06-16','Perempuan','Kuning','2022-09-09')];
 const ds=[{id:'d1',name:'Dojo Harimau Putih',city:'Depok',addr:'Jl. Margonda Raya No. 12, Depok',phone:'081234567890',email:'harimauputih@contoh.id',org:'Pengcab Kota Depok',year:'2008',head:'Sensei Hendra',reg:'DPK-0142',desc:'Dojo karate untuk anak, remaja, dan dewasa.'},{id:'d2',name:'Dojo Garuda Nusantara',city:'Bandung',addr:'',phone:'',email:'',org:'',year:'',head:'Sensei Rudi',reg:'',desc:''}];
 const ev=(n,d,p,l)=>({id:uid(),name:n,date:d,place:p,level:l,entries:[]});
 const e1=ev('Kejurprov Karate Jawa Barat 2026','2026-12-06','GOR Padjajaran, Bandung','Provinsi');e1.entries=[{sid:a[0].id,cat:'Kumite -40 kg',status:'Siap'},{sid:a[1].id,cat:'Kata Perorangan U-14',status:'Terdaftar'}];
 const mk=(sid,c,l,cat,cls,m,y)=>({id:uid(),sid,champ:c,level:l,cat,cls,medal:m,year:y});
 const U=(d,name,jabatan,username,role)=>({id:uid(),dojo:d,name,jabatan,username,pass:'demo123',role});return{dojos:ds,users:[U('d1','Sensei Hendra','Ketua','admin1','Admin'),U('d1','Sensei Maya','Pelatih','coach1','Pelatih'),U('d2','Sensei Rudi','Ketua','admin2','Admin')],data:{d1:{students:a,eval:[{id:uid(),sid:a[0].id,date:'2026-10-01',kihon:4,kata:3,kumite:4,fisik:4,disiplin:5,note:'Semangat tinggi, perlu rapikan kuda-kuda.'},{id:uid(),sid:a[0].id,date:'2026-11-05',kihon:4,kata:4,kumite:4,fisik:4,disiplin:5,note:'Kata Heian Sandan meningkat.'}],
 ach:[mk(a[1].id,'Kejurkot Depok','Cabang','Kata','U-14',1,2026),mk(a[0].id,'Kejurprov Jabar','Provinsi','Kumite','-40 kg',2,2026),mk(a[2].id,'Kejurnas Open','Nasional','Kumite','-60 kg',3,2025),mk(a[6].id,'Asia Open','Internasional','Kumite','-75 kg',3,2025),mk(a[1].id,'Piala Dojo','Dojo','Kata','U-14',1,2025),mk(a[5].id,'Kejurkot Depok','Cabang','Kata','U-16',2,2026)],
 events:[e1,ev('Kejurnas Piala Menpora','2027-02-20','Jakarta','Nasional')],ukt:{period:'UKT Desember 2026',date:'2026-12-14',sel:[]},coaches:[{id:uid(),name:'Sensei Hendra',role:'Admin'},{id:uid(),name:'Sensei Maya',role:'Pelatih'}]},
 d2:{students:b,eval:[],ach:[],events:[],ukt:{period:'UKT Desember 2026',date:'2026-12-20',sel:[]},coaches:[{id:uid(),name:'Sensei Rudi',role:'Admin'}]}}}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let ses=null,V='dash',SID=null,EID=null,Q={q:'',belt:'',st:'Aktif'},PF={y:'',l:''},TP='';
/* Satu-satunya pintu data: selalu terfilter oleh dojo aktif (setara RLS dojo_id) */
const D=()=>S.data[ses.dojo],DJ=()=>S.dojos.find(x=>x.id==ses.dojo),adm=()=>ses.role=='Admin';
const stu=id=>D().students.find(s=>s.id==id)||{name:'(dihapus)',belt:'Putih'};
const bd=b=>`<span class=bd style="background:${BC[b]||'#ddd'};color:${['Putih','Kuning'].includes(b)?'#111':'#fff'}">${b}</span>`;
const av=s=>s.photo?`<img class=av style="border-color:${BC[s.belt]}" src="${s.photo}" alt="">`:`<div class=av style="border-color:${BC[s.belt]}">${esc(s.name.split(' ').map(w=>w[0]).slice(0,2).join(''))}</div>`;
const F=(n,l,v='',t='text',o)=>`<label>${l}${o?`<select name=${n}>${o.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`}).join('')}</select>`:`<input name=${n} type=${t} value="${esc(v)}">`}</label>`;
function modal(t,body,fn,btn='Simpan'){$('#m').innerHTML=`<div class=ov><div class=mo><div class=mh>${t}<button class=x aria-label="Tutup" onclick=cm()>✕</button></div><form id=mf>${body}<button class="btn pri wide">${btn}</button></form></div></div>`;$('#mf').onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(e.target)));cm()}}
const cm=()=>{$('#m').innerHTML=''};
const go=v=>{V=v;SID=EID=null;draw();scrollTo(0,0)};
function login(){const o=S.dojos.map(d=>`<div class="row card" tabindex=0 onclick="enter('${d.id}')" style="margin-bottom:8px"><div class=av style="border-color:var(--acc)">${esc(d.name.split(' ')[1][0])}</div><div class=g><b>${esc(d.name)}</b><small>${esc(d.city)}, ${S.data[d.id].students.length} murid</small></div></div>`).join('');
$('#app').innerHTML=`<div class=login><div class=hero><h1>DojoFlow</h1><p style="margin:8px 0 0;opacity:.85">Kelola murid, sabuk, prestasi, kejuaraan, dan UKT dojo Anda dalam satu tempat.</p></div><h3 style="margin:0 0 8px">Masuk ke dojo</h3>${o}<button class="btn dk wide" onclick=newDojo()>Daftarkan dojo baru</button><p class=note>Mode demo: data tersimpan di browser ini. Setiap dojo punya ruang data sendiri dan tidak bisa saling melihat. Pada versi produksi, isolasi dijaga oleh dojo_id dan Row Level Security di Supabase.</p></div>`}
function enter(id){modal('Masuk sebagai',`<p class=note style="margin:0 0 8px">Admin punya akses penuh. Pelatih mencatat latihan, prestasi, kejuaraan, dan UKT.</p>${F('role','Peran','Pelatih',0,['Pelatih','Admin'])}`,f=>{ses={dojo:id,role:f.role};V='dash';draw()},'Masuk')}
function newDojo(){modal('Daftarkan dojo baru',F('name','Nama dojo')+F('city','Kota')+F('admin','Nama ketua / pelatih kepala'),f=>{if(!f.name)return;const id='d'+uid();S.dojos.push({id,name:f.name,city:f.city});S.data[id]={students:[],eval:[],ach:[],events:[],ukt:{period:'UKT '+new Date().getFullYear(),date:'',sel:[]},coaches:[{id:uid(),name:f.admin||'Admin',role:'Admin'}]};save();ses={dojo:id,role:'Admin'};draw()},'Buat dojo')}
function draw(){if(!ses)return login();const tabs=[['dash','Beranda'],['murid','Murid'],['prestasi','Prestasi'],['event','Kejuaraan'],['ukt','UKT']];if(adm())tabs.push(['tim','Tim']);
const P={dash,murid,prestasi,event,ukt,tim}[V]();
$('#app').innerHTML=`<header><div class=logo>D</div><div class=g><b>${esc(DJ().name)}</b><small>${esc(DJ().city)}</small></div><span class=chip>${ses.role}</span><button class="btn sm" onclick="ses=null;draw()">Keluar</button></header><nav>${tabs.map(t=>`<button class="${V==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}</nav><main>${P}</main>`}
/* BERANDA */
function dash(){const d=D(),act=d.students.filter(s=>s.status=='Aktif'),mx=Math.max(1,...BELTS.map(b=>act.filter(s=>s.belt==b).length));
const md=[1,2,3].map(m=>d.ach.filter(a=>a.medal==m).length),tot=md.reduce((a,b)=>a+b,0);let c=0;const cg=tot?md.map((n,i)=>{const s=c;c+=n/tot*100;return`${MC[i+1]} ${s}% ${c}%`}).join(','):'var(--line) 0 100%';
const up=[...d.events.map(e=>({t:'Kejuaraan',n:e.name,d:e.date})),...(d.ukt.date?[{t:'UKT',n:d.ukt.period,d:d.ukt.date}]:[])].filter(x=>x.d>=today()).sort((a,b)=>a.d>b.d?1:-1);
return`<h2 style="margin-bottom:12px">Ringkasan dojo</h2><div class=kpis><div class=kpi><b>${act.length}</b><span>Murid aktif</span></div><div class="kpi a"><b>${tot}</b><span>Total medali</span></div><div class=kpi><b>${d.events.length}</b><span>Kejuaraan</span></div><div class=kpi><b>${d.ukt.sel.length}</b><span>Calon UKT</span></div></div>
<div class=grid><div class=card><h3>Murid per sabuk</h3>${BELTS.map(b=>{const n=act.filter(s=>s.belt==b).length;return`<div class=hb><span>${b}</span><i style="width:${n/mx*60}%;background:${BC[b]}"></i><b>${n}</b></div>`}).join('')}</div>
<div class=card><h3>Medali dojo</h3><div style="display:flex;gap:18px;align-items:center;margin-top:10px"><div class=dn style="background:conic-gradient(${cg})"><div>${tot}</div></div><div>${[1,2,3].map(m=>`<div class=hb><i style="width:14px;background:${MC[m]}"></i>${MD[m]}: <b>${md[m-1]}</b></div>`).join('')}</div></div></div></div>
<div class=card><h3>Agenda terdekat</h3>${up.length?up.map(x=>{const dl=Math.ceil((new Date(x.d)-new Date(today()))/864e5);return`<div class=row style="cursor:default"><div class=g><b>${esc(x.n)}</b><small>${x.t}, ${fd(x.d)}</small></div><span class=${dl<=30?'warn':'tag'}>${dl} hari lagi</span></div>`}).join(''):'<p class=emp>Belum ada agenda. Tambahkan kejuaraan atau atur tanggal UKT.</p>'}</div>`}
/* MURID */
function lst(){const d=D();const r=d.students.filter(s=>(!Q.q||(s.name+s.nia).toLowerCase().includes(Q.q.toLowerCase()))&&(!Q.belt||s.belt==Q.belt)&&(!Q.st||s.status==Q.st));return r.length?r.map(s=>`<div class=row tabindex=0 onclick="SID='${s.id}';draw()">${av(s)}<div class=g><b>${esc(s.name)}</b><small>${esc(s.nia)}, ${age(s.dob)} tahun</small></div>${bd(s.belt)}</div>`).join(''):'<p class=emp>Tidak ada murid yang cocok. Ubah pencarian atau tambah murid baru.</p>'}
function murid(){if(SID)return detail();return`<div class=bar><h2 class=g>Murid</h2><button class="btn pri" onclick="stuForm()">+ Tambah murid</button></div><div class=bar><input class=g placeholder="Cari nama atau NIA" value="${esc(Q.q)}" oninput="Q.q=this.value;$('#lst').innerHTML=lst()" style="flex:2;min-width:150px"><select style="flex:1;width:auto" onchange="Q.belt=this.value;$('#lst').innerHTML=lst()"><option value="">Semua sabuk</option>${BELTS.map(b=>`<option ${Q.belt==b?'selected':''}>${b}</option>`).join('')}</select><select style="flex:1;width:auto" onchange="Q.st=this.value;$('#lst').innerHTML=lst()">${['Aktif','Non-aktif',''].map(x=>`<option value="${x}" ${Q.st==x?'selected':''}>${x||'Semua status'}</option>`).join('')}</select></div><div class=card id=lst style="padding:4px">${lst()}</div>`}
let tmpPh='';function ph(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d'),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,96,96);tmpPh=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}
function stuForm(id){const s=id?stu(id):{belt:'Putih',join:today(),status:'Aktif',sex:'Laki-laki'};tmpPh=s.photo||'';

function detail(){const s=stu(SID),d=D(),ev=d.eval.filter(e=>e.sid==SID).sort((a,b)=>a.date<b.date?1:-1),ac=d.ach.filter(a=>a.sid==SID);

function dojoForm(){const j=DJ();tmpPh=j.logo||'';modal('Ubah profil dojo',`<label>Logo dojo<input type=file accept="image/*" onchange="ph(this)"></label>${F('name','Nama dojo',j.name)}${F('city','Kota',j.city)}${F('addr','Alamat sekretariat',j.addr)}<div class=two>${F('phone','Telepon / WhatsApp',j.phone,'tel')}${F('email','Email',j.email,'email')}</div><div class=two>${F('org','Induk organisasi / cabang',j.org)}${F('year','Tahun berdiri',j.year,'number')}</div><div class=two>${F('head','Ketua / pelatih kepala',j.head)}${F('reg','Nomor registrasi',j.reg)}</div><label>Tentang dojo<textarea name=desc rows=3>${esc(j.desc)}</textarea></label>`,f=>{if(!f.name)return;Object.assign(j,f,{logo:tmpPh});save();draw()})}
function userForm(id){const u=id?S.users.find(x=>x.id==id&&x.dojo==ses.dojo):{role:'Pelatih'};if(!u)return;modal(id?'Ubah akun':'Buat akun pengurus',F('name','Nama lengkap',u.name)+F('jabatan','Jabatan (misalnya Sekretaris, Pelatih)',u.jabatan)+F('username','Nama pengguna',u.username)+F('pass',id?'Kata sandi baru (kosongkan jika tidak diganti)':'Kata sandi (minimal 6 karakter)','','password')+F('role','Peran',u.role,0,[['Pelatih','Pelatih (mencatat latihan, prestasi, kejuaraan, UKT)'],['Admin','Admin (akses penuh)']]),f=>{const un=f.username.trim().toLowerCase();if(!f.name||!un)return alert('Nama dan nama pengguna wajib diisi.');if(S.users.some(x=>x.username==un&&x.id!=id))return alert('Nama pengguna sudah dipakai. Pilih yang lain.');if(!id&&f.pass.length<6||id&&f.pass&&f.pass.length<6)return alert('Kata sandi minimal 6 karakter.');if(id)Object.assign(u,{name:f.name,jabatan:f.jabatan,username:un,role:f.role,pass:f.pass||u.pass});else S.users.push({id:uid(),dojo:ses.dojo,name:f.name,jabatan:f.jabatan,username:un,pass:f.pass,role:f.role});save();draw()})}
function delUser(id){const u=S.users.find(x=>x.id==id&&x.dojo==ses.dojo);if(!u||u.id==ses.uid||!confirm('Hapus akun '+u.name+'?'))return;S.users=S.users.filter(x=>x.id!=id);save();draw()}
function pwForm(){modal('Ganti kata sandi',F('old','Kata sandi lama','','password')+F('n1','Kata sandi baru (minimal 6 karakter)','','password'),f=>{const u=S.users.find(x=>x.id==ses.uid);if(u.pass!=f.old)return alert('Kata sandi lama salah.');if(f.n1.length<6)return alert('Kata sandi baru minimal 6 karakter.');u.pass=f.n1;save();alert('Kata sandi diganti.')})}
draw();
</script></body></html>
