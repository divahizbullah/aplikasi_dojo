<title>Dojoku – Manajemen Dojo Karate</title>
<script>try{var t=localStorage.getItem('dojoflow_tema');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1b1f27;--mut:#667085;--line:#e3e6ea;--navy:#082d82;--acc:#0b3a9a;--accs:#e8eefc;--gold:#f5b638;--ok:#2e7d32;--onp:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2127;--ink:#eceef1;--mut:#9aa3af;--line:#2e333b;--acc:#6c9bff;--accs:#1b2740;--ok:#4ade80;--onp:#10151c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2127;--ink:#eceef1;--mut:#9aa3af;--line:#2e333b;--acc:#6c9bff;--accs:#1b2740;--ok:#4ade80;--onp:#10151c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{margin:0}h2{font-size:20px}h3{font-size:16px;margin-bottom:8px}
button,input,select,textarea{font:inherit;color:inherit}
.shell{display:flex;min-height:100vh}
#side{width:250px;flex:none;background:var(--navy);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid #ffffff22}.brand b{font-size:14px;line-height:1.25}.brand small{display:block;font-weight:400;opacity:.75;font-size:12px}
.lg2,.brand img{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;flex:none;object-fit:cover}
#nav{display:flex;flex-direction:column;gap:4px;padding:10px;flex:1}
#nav button{background:transparent;color:#fff;text-align:left;padding:10px 12px;border:0;border-radius:8px;cursor:pointer;min-height:44px}
#nav button:hover{background:#ffffff1f}#nav button.on{background:var(--gold);color:#082d82;font-weight:600}
.lo{margin:10px;background:transparent;color:#fff;border:1px solid #ffffff66;border-radius:8px;padding:10px;cursor:pointer;min-height:44px}
#cont{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}.top b{font-size:16px}#who{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mn{display:none}#scrim{display:none;position:fixed;inset:0;background:#0008;z-index:25}#scrim.on{display:block}
@media(max-width:800px){#side{position:fixed;left:0;top:0;margin-left:-260px;transition:margin .2s;box-shadow:0 0 20px #0006}#side.open{margin-left:0}.mn{display:inline-block}}
main{max-width:1000px;margin:0 auto;padding:16px}
.g{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px #0000000f;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 3px #0000000f;padding:14px}.kpi b{display:block;font-size:26px;line-height:1.15}.kpi span{font-size:13px;color:var(--mut)}
.kpi.st{display:flex;gap:12px;align-items:center}.ic{font-style:normal;font-size:22px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accs);flex:none}
.kpi.a{background:var(--gold);border-color:var(--gold);color:#082d82}.kpi.a span{color:#082d82}.kpi[style]{color:#fff;border:0}.kpi[style] span{color:#fff}
.hero{display:flex;align-items:center;gap:16px;padding:20px;border-radius:16px;color:#fff;background:linear-gradient(120deg,#082d82,#0b3a9a 55%,#2f6fe0);margin-bottom:16px}.hero h2{font-size:22px;margin:2px 0}.hero small,.hero span{opacity:.85;font-size:13px;color:#fff}.hero img{width:64px;height:64px;border-radius:50%;background:#fff;object-fit:cover;flex:none}.hero .lg2{width:64px;height:64px;font-size:32px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer;min-height:44px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onp);font-weight:600}.btn.dk{background:var(--navy);border-color:var(--navy);color:#fff}.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}.btn.wide{width:100%;margin-top:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible,#nav button:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-height:44px}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-top:10px}label input,label select,label textarea{margin-top:4px;color:var(--ink);font-weight:400}
.row{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.row:hover{background:var(--accs)}.row:last-child{border:0}small{color:var(--mut);display:block}
.av{width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600;flex:none;object-fit:cover;border:3px solid}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.sec{padding:12px 12px 4px}.sec h3{margin:0}.dg>.card{margin:0}.qa{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.dd{width:46px;flex:none;text-align:center;border-radius:10px;background:var(--accs);color:var(--acc);padding:5px 0;line-height:1.1}.dd b{display:block;font-size:18px}.dd span{font-size:10px;font-weight:700;letter-spacing:.06em}
.cd{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--gold);color:#082d82;white-space:nowrap}.hero{flex-wrap:wrap;box-shadow:0 8px 24px #082d8233}.k6{grid-template-columns:repeat(2,1fr)}@media(min-width:700px){.k6{grid-template-columns:repeat(3,1fr)}}.hero .nx{display:block;width:fit-content;margin-top:10px;background:#ffffff26;border-radius:10px;padding:6px 12px;font-size:13px;color:#fff}

function runUkt(){const d=D(),u=d.ukt,dt=u.date&&u.date<=today()?u.date:today(),L=[];

/* ===== KEAMANAN: hash kata sandi, batas percobaan, sesi, sinkron antar-tab ===== */
const PW_MIN=8,IDLE=30*60*1000,SESS=12*36e5,FK='dojoflow_fail';
let SX={exp:0,last:0},WEAK=0;
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))),ub=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function kdf(pw,salt,it){if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},k,256))}
async function mkPw(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),it=150000;return{s:b64(salt),i:it,h:b64(await kdf(pw,salt,it))}}
const same=(a,b)=>{if(a.length!=b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a[i]^b[i];return r==0};
async function chkPw(u,pw){try{
 if(!u||(!u.ph&&u.pass==null)){await kdf(pw,new Uint8Array(16),150000);return false}
 if(!u.ph){const ok=u.pass===pw;if(ok){u.ph=await mkPw(pw);delete u.pass;save()}return ok}
 return same(await kdf(pw,ub(u.ph.s),u.ph.i),ub(u.ph.h))}catch(e){alert('Browser tidak mendukung pengamanan kata sandi. Buka aplikasi lewat alamat HTTPS.');return false}}
const fl=()=>{try{return JSON.parse(localStorage.getItem(FK))||{}}catch(e){return{}}},fw=o=>{try{localStorage.setItem(FK,JSON.stringify(o))}catch(e){}};
function lockLeft(k){const r=fl()[k];return r&&r.t>Date.now()?Math.ceil((r.t-Date.now())/1000):0}
function failed(k){const o=fl(),r=o[k]||{n:0,t:0};r.n++;if(r.n>=5)r.t=Date.now()+Math.min(900,30*2**(r.n-5))*1000;o[k]=r;fw(o);return lockLeft(k)}
function clearFail(k){const o=fl();delete o[k];fw(o)}
const tryMsg=l=>'Terlalu banyak percobaan. Coba lagi dalam '+l+' detik.';
const okUn=u=>/^[a-z0-9._-]{3,30}$/.test(u);
const okPw=(p,un)=>p.length>=PW_MIN&&p.toLowerCase()!=(un||'').toLowerCase();
const PWMSG='Kata sandi minimal '+PW_MIN+' karakter dan tidak boleh sama dengan nama pengguna.',UNMSG='Nama pengguna 3 sampai 30 karakter: huruf kecil, angka, titik, strip, atau garis bawah.';

const acc=u=>u.acc||u.id,mems=u=>S.users.filter(x=>acc(x)==acc(u)),ME0=()=>ses&&!ses.central?S.users.find(x=>x.id==ses.uid):null;

const DRV_GS="// Penerima logo dojo untuk Dojoku. Tempel di script.google.com (Proyek baru), ganti KUNCI, lalu\n// Terapkan > Deployment baru > Aplikasi web > Jalankan sebagai: Saya > Akses: Siapa saja.\nvar KUNCI = 'GANTI_DENGAN_KUNCI_RAHASIA_ANDA';\nfunction out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);}\nfunction doGet(e){\n  var p = e.parameter || {};\n  if (p.key !== KUNCI) return out({ok:false, err:'Kunci salah'});\n  try { var f = DriveApp.getFolderById(String(p.folder||'')); return out({ok:true, folder:f.getName()}); }\n  catch (x) { return out({ok:false, err:'Folder tidak ditemukan atau tidak ada akses'}); }\n}\nfunction doPost(e){\n  try{\n    var d = JSON.parse(e.postData.contents);\n    if (d.key !== KUNCI) return out({ok:false, err:'Kunci salah'});\n    var folder = DriveApp.getFolderById(String(d.folder||''));\n    var mime = /^image\\/(png|jpeg|webp|gif)$/.test(d.mime) ? d.mime : 'image/png';\n    var ext = mime === 'image/png' ? 'png' : mime === 'image/jpeg' ? 'jpg' : mime === 'image/webp' ? 'webp' : 'gif';\n    var id = String(d.dojoId||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,20);\n    var nama = String(d.nama||'Dojo').replace(/[\\\\\\/:*?\"<>|\\[\\]']/g,'').slice(0,80);\n    var title = 'Logo - ' + nama + ' [' + id + '].' + ext;\n    var old = folder.searchFiles(\"title contains '[\" + id + \"]' and title contains 'Logo - '\");\n    while (old.hasNext()) old.next().setTrashed(true);\n    var f = folder.createFile(Utilities.newBlob(Utilities.base64Decode(d.data), mime, title));\n    f.setDescription('Dojo: ' + nama + (d.kota ? ', ' + d.kota : '') + (d.org ? ' | ' + d.org : ''));\n    return out({ok:true, id:f.getId(), url:f.getUrl()});\n  }catch(err){ return out({ok:false, err:String(err)}); }\n}";

const FB_CFG={apiKey:"AIzaSyD3pz9ClkDby6-4HXaNyXQb-wIR4b5QpiA",authDomain:"aplikasidojoku.firebaseapp.com",projectId:"aplikasidojoku",storageBucket:"aplikasidojoku.firebasestorage.app",messagingSenderId:"292830347015",appId:"1:292830347015:web:a1a2149f94021d5c564fa2"};
const CLOUD={db:null,ready:false,cid:Math.random().toString(36).slice(2)+Date.now().toString(36),timer:0,busy:false,again:false,unsub:null,CH:300000};
const cRef=()=>CLOUD.db.collection('dojoku');
/* potong data tanpa memenggal pasangan surrogate (emoji) */
function cloudChunks(s){const o=[];let i=0;while(i<s.length){let e=Math.min(i+CLOUD.CH,s.length);if(e<s.length){const c=s.charCodeAt(e-1);if(c>=0xD800&&c<=0xDBFF)e--}o.push(s.slice(i,e));i=e}return o}
function cloudSet(t){try{const e=document.getElementById('cloudst');if(e)e.textContent=t}catch(x){}}
async function cloudRead(){const m=await cRef().doc('meta').get();if(!m.exists)return null;const d=m.data(),n=d.n||0;if(!n)return{meta:d,state:null};const qs=await Promise.all(Array.from({length:n},(_,i)=>cRef().doc('c'+i).get()));let s='';for(const q of qs){if(!q.exists)throw new Error('potongan data hilang');s+=q.data().t}return{meta:d,state:JSON.parse(s)}}
function cloudApply(R){/* gabungkan data cloud ke perangkat ini */
 try{let L=R.state;if(!L||!L.users||!L.dojos||!L.data)return false;
  S=ses?mergeS(L):L;try{rolesFix()}catch(e){}S._rev=Math.max(S._rev||0,R.meta.rev||0);
  localStorage.setItem(K,JSON.stringify(S));
  if(ses)try{vses()}catch(e){}
  if(!$('#m').innerHTML)draw();return true}catch(e){console.error(e);return false}}
async function cloudPull(){if(!CLOUD.ready)return;try{cloudSet('Mengambil data...');const R=await cloudRead();if(R&&R.state&&(R.meta.rev||0)>(S._rev||0)){cloudApply(R)}cloudSet('Tersinkron ☁️')}catch(e){console.error(e);cloudSet('Offline')}}
function cloudPush(){if(!CLOUD.ready)return;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudDoPush,1500)}
async function cloudDoPush(){if(!CLOUD.ready)return;if(CLOUD.busy){CLOUD.again=true;return}CLOUD.busy=true;
 try{cloudSet('Menyimpan ke cloud...');
  const cur=await cRef().doc('meta').get();
  if(cur.exists&&(cur.data().rev||0)>(S._rev||0)&&cur.data().by!==CLOUD.cid){/* ada versi lebih baru di cloud: gabungkan dulu */
   const R=await cloudRead();if(R&&R.state){cloudApply(R);S._rev=(S._rev||0)+1;localStorage.setItem(K,JSON.stringify(S))}}
  const str=JSON.stringify(S),parts=cloudChunks(str);
  const oldN=cur.exists?(cur.data().n||0):0,b=CLOUD.db.batch();
  parts.forEach((t,i)=>b.set(cRef().doc('c'+i),{t}));
  for(let i=parts.length;i<oldN;i++)b.delete(cRef().doc('c'+i));
  b.set(cRef().doc('meta'),{rev:S._rev||0,n:parts.length,by:CLOUD.cid,at:firebase.firestore.FieldValue.serverTimestamp()});
  await b.commit();cloudSet('Tersinkron ☁️')}
 catch(e){console.error(e);const c=(e&&e.code)||'';cloudSet(c=='permission-denied'?'Ditolak aturan Firestore (permission-denied): perbarui Rules di Firebase, data aman di perangkat':'Gagal sinkron ('+(c||String((e&&e.message)||e).slice(0,50))+'), data aman di perangkat')}
 finally{CLOUD.busy=false;if(CLOUD.again){CLOUD.again=false;cloudPush()}}}
async function cloudInit(){
 try{if(!window.firebase)throw new Error('SDK Firebase tidak termuat');
  firebase.initializeApp(FB_CFG);
  await firebase.auth().signInAnonymously();
  CLOUD.db=firebase.firestore();CLOUD.ready=true;
  const R=await cloudRead();
  if(!R||!R.state){await cloudDoPush()}/* cloud masih kosong: unggah data perangkat ini */
  else if((R.meta.rev||0)>(S._rev||0))cloudApply(R);
  else if((R.meta.rev||0)<(S._rev||0))await cloudDoPush();
  cloudSet('Tersinkron ☁️');
  /* realtime: perangkat lain menyimpan -> ikut berubah */
  CLOUD.unsub=cRef().doc('meta').onSnapshot(s=>{if(!s.exists)return;const d=s.data();if(d.by===CLOUD.cid)return;if((d.rev||0)>(S._rev||0))cloudPull()},e=>console.error(e));
  addEventListener('online',()=>cloudPush());
 }catch(e){console.error('Firebase:',e);CLOUD.err=(e&&e.code)||String((e&&e.message)||e).slice(0,60);cloudSet('Offline: '+((e&&e.code)||String((e&&e.message)||e).slice(0,50))+' (data di perangkat)')}}
cloudInit();

if(document.readyState=='loading')document.addEventListener('DOMContentLoaded',bootGo);else bootGo();

"true\" aria-labelledby=\"klTitle\">\n\u003cdiv class=\"row\">\u003ch2 id=\"klTitle\" style=\"margin:0\">Semua kwitansi pengeluaran\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cbutton id=\"klClose\" type=\"button\">Tutup\u003c/button>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin:12px 0 8px\">\u003cdiv style=\"flex:1;min-width:200px\">\u003clabel for=\"klQ\">Cari kwitansi\u003c/label>\u003cinput id=\"klQ\" type=\"search\" placeholder=\"Nomor, keterangan, penerima, kategori...\">\u003c/div>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-bottom:8px\">\u003cspan class=\"hint\" id=\"klInfo\" style=\"margin:0\">\u003c/span>\u003cspan class=\"sp\">\u003c/span>\u003cbutton id=\"klPrintSel\" type=\"button\">Cetak terpilih\u003c/button>\u003cbutton class=\"p\" id=\"klPrintAll\" type=\"button\">Cetak semua yang tampil\u003c/button>\u003c/div>\n\u003cdiv class=\"tw\" style=\"border:1px solid var(--line);border-radius:10px\">\u003ctable style=\"min-width:720px\">\u003cthead>\u003ctr>\u003cth style=\"width:34px\">\u003cinput type=\"checkbox\" id=\"klAll\" style=\"width:auto\" aria-label=\"Pilih semua\">\u003c/th>\u003cth>No. kwitansi\u003c/th>\u003cth>Tanggal\u003c/th>\u003cth>Keterangan\u003c/th>\u003cth>Penerima\u003c/th>\u003cth class=\"n\">Jumlah\u003c/th>\u003cth>Aksi\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"klBody\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp class=\"hint\">Centang beberapa kwitansi lalu klik Cetak terpilih, atau cetak satu per satu dengan tombol Cetak di tiap baris.\u003c/p>\n\u003c/div>\u003c/div>\n\u003cdiv id=\"kpModal\" class=\"ov np\" hidden>\u003cdiv class=\"mdl wide\" style=\"max-width:600px\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"kpTitle\">\n\u003cdiv class=\"row\">\u003ch2 id=\"kpTitle\" style=\"margin:0\">Detail pengeluaran\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cspan class=\"kpno\" id=\"kpNo\">\u003c/span>\u003c/div>\n\u003cdiv class=\"kpamt\" id=\"kpAmt\">\u003c/div>\u003cdiv class=\"hint\" id=\"kpTb\" style=\"margin:2px 0 0;font-style:italic\">\u003c/div>\n\u003cdl class=\"kpd\" id=\"kpDet\">\u003c/dl>\n\u003cdiv class=\"row\" style=\"margin-top:14px\">\u003cdiv class=\"kpact\">\u003cbutton class=\"p\" id=\"kpPrint\" type=\"button\">Cetak kwitansi\u003c/button>\u003cbutton id=\"kpEdit\" type=\"button\">Edit\u003c/button>\u003cbutton class=\"dg\" id=\"kpDel\" type=\"button\">Hapus\u003c/button>\u003c/div>\u003cspan class=\"sp\">\u003c/span>\u003cbutton id=\"kpClose\" type=\"button\">Tutup\u003c/button>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv id=\"fModal\" class=\"ov np\" hidden>\u003cdiv class=\"mdl wide\" style=\"max-width:760px\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"fTitle\">\n\u003ch2 id=\"fTitle\">Tambah peserta\u003c/h2>\n\u003cp class=\"m e\" id=\"noDojo\" hidden>Belum ada dojo terdaftar. Admin perlu mendaftarkan dojo dulu (menu Administrator, perlu login) sebelum peserta bisa ditambahkan.\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003clabel for=\"fNama\">Nama\u003c/label>\u003cinput id=\"fNama\">\u003c/div>\n\u003cdiv>\u003clabel for=\"fDojo\">Dojo (terdaftar)\u003c/label>\u003cselect id=\"fDojo\">\u003c/select>\u003c/div>\n\u003cdiv>\u003clabel for=\"fWil\">Wilayah (terisi dari dojo, bisa diubah)\u003c/label>\u003cinput id=\"fWil\">\u003c/div>\n\u003cdiv>\u003clabel for=\"fPelatih\">Nama pelatih (otomatis)\u003c/label>\u003cinput id=\"fPelatih\" readonly>\u003c/div>\n\u003cdiv>\u003clabel for=\"fTmp\">Tempat lahir\u003c/label>\u003cinput id=\"fTmp\">\u003c/div>\n\u003cdiv>\u003clabel for=\"fTgl\">Tanggal lahir\u003c/label>\u003cinput id=\"fTgl\" type=\"date\">\u003c/div>\n\u003cdiv>\u003clabel for=\"fDari\">Tingkat sekarang\u003c/label>\u003cinput id=\"fDari\" list=\"tk\">\u003c/div>\n\u003cdiv>\u003clabel for=\"fKe\">Tingkat tujuan\u003c/label>\u003cinput id=\"fKe\" list=\"tk\">\u003c/div>\n\u003c/div>\n\u003cdatalist id=\"tk\">\u003coption>Kyu 7 (Putih)\u003coption>Kyu 6 (Kuning)\u003coption>Kyu 5 (Oranye)\u003coption>Kyu 4 (Hijau)\u003coption>Kyu 3 (Biru)\u003coption>Kyu 2 (Cokelat)\u003coption>Kyu 1 (Cokelat)\u003c/datalist>\n\u003cdiv id=\"fMsg\" class=\"m e\" role=\"alert\">\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"p\" id=\"save\" type=\"button\">Simpan peserta\u003c/button>\u003cbutton id=\"cancel\" type=\"button\">Batal\u003c/button>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv id=\"dojoModal\" class=\"ov np\" hidden>\u003cdiv class=\"mdl wide\" style=\"max-width:1020px\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dmT\">\n\u003cdiv class=\"row\" style=\"margin-bottom:10px\">\u003ch2 id=\"dmT\" style=\"margin:0\">Dojo terdaftar\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cselect id=\"dmW\" style=\"max-width:200px\" aria-label=\"Filter wilayah\">\u003c/select>\u003cinput id=\"dmQ\" placeholder=\"Cari dojo / pelatih\" style=\"max-width:200px\">\u003cbutton class=\"s\" id=\"dmClose\" type=\"button\">Tutup\u003c/button>\u003c/div>\n\u003cdiv class=\"tw\" style=\"max-height:65vh\">\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Dojo\u003c/th>\u003cth>Wilayah\u003c/th>\u003cth>Pelatih\u003c/th>\u003cth>Kontak\u003c/th>\u003cth class=\"n\">Peserta\u003c/th>\u003cth class=\"n\">Biaya ujian\u003c/th>\u003cth>Status\u003c/th>\u003cth>Aksi\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"ab\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv id=\"dFormModal\" class=\"ov np\" hidden>\u003cdiv class=\"mdl wide\" style=\"max-width:760px\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"aTitle\">\n\u003ch2 id=\"aTitle\">Pendaftaran dojo\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 12px\">Peserta hanya bisa didaftarkan untuk dojo yang sudah terdaftar di sini. Wilayah dan nama pelatih peserta diambil otomatis dari data dojo. Biaya ujian dan status pembayaran dicatat per dojo di sini; tagihan dojo = jumlah peserta x biaya ujian.\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003clabel for=\"aNama\">Nama dojo\u003c/label>\u003cinput id=\"aNama\">\u003c/div>\n\u003cdiv>\u003clabel for=\"aWil\">Wilayah\u003c/label>\u003cinput id=\"aWil\">\u003c/div>\n\u003cdiv>\u003clabel for=\"aPel\">Nama pelatih\u003c/label>\u003cinput id=\"aPel\">\u003c/div>\n\u003cdiv>\u003clabel for=\"aTelp\">Kontak (opsional)\u003c/label>\u003cinput id=\"aTelp\">\u003c/div>\n\u003cdiv>\u003clabel for=\"aEmail\">Email pelatih (untuk kirim rekap)\u003c/label>\u003cinput id=\"aEmail\" type=\"email\" placeholder=\"pelatih@email.com\">\u003c/div>\n\u003cdiv>\u003clabel for=\"aUjian\">Biaya ujian per peserta (Rp)\u003c/label>\u003cinput id=\"aUjian\" type=\"number\" min=\"0\">\u003c/div>\n\u003cdiv>\u003clabel for=\"aStat\">Status pembayaran\u003c/label>\u003cselect id=\"aStat\">\u003coption>Belum\u003c/option>\u003coption>Lunas\u003c/option>\u003c/select>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"p\" id=\"aSave\" type=\"button\">Daftarkan dojo\u003c/button>\u003cbutton id=\"aCancel\" type=\"button\">Batal\u003c/button>\u003c/div>\n\u003cdiv id=\"aMsg\" class=\"m\" role=\"status\">\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv id=\"rbModal\" class=\"ov np\" hidden>\u003cdiv class=\"mdl wide\" style=\"max-width:560px\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rbT\">\n\u003ch2 id=\"rbT\" style=\"margin:0 0 6px\">Buat acara UKT baru\u003c/h2>\n\u003cp class=\"hint\" id=\"rbInfo\" style=\"margin:0 0 12px\">\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv style=\"grid-column:1/-1\">\u003clabel for=\"rbJudul\">Judul kegiatan (dari Dojoku pusat)\u003c/label>\u003cinput id=\"rbJudul\" readonly>\u003c/div>\n\u003cdiv>\u003clabel for=\"rbTgl\">Tanggal\u003c/label>\u003cinput id=\"rbTgl\" type=\"date\" readonly style=\"pointer-events:none\">\u003c/div>\n\u003cdiv>\u003clabel for=\"rbTempat\">Tempat\u003c/label>\u003cinput id=\"rbTempat\" readonly>\u003c/div>\n\u003cdiv style=\"grid-column:1/-1\">\u003clabel for=\"rbOrg\">Penyelenggara\u003c/label>\u003cinput id=\"rbOrg\" readonly>\u003c/div>\n\u003c/div>\n\u003clabel class=\"row\" style=\"margin:12px 0 0;font-size:13px;color:var(--ink)\">\u003cinput type=\"checkbox\" id=\"rbDojo\" style=\"width:auto\" checked> Pertahankan daftar dojo (status pembayaran dikembalikan ke Belum)\u003c/label>\n\u003cdiv class=\"row\" style=\"margin-top:14px\">\u003cbutton class=\"p\" id=\"rbGo\" type=\"button\">Arsipkan dan mulai acara baru\u003c/button>\u003cbutton id=\"rbCancel\" type=\"button\">Batal\u003c/button>\u003c/div>\n\u003cdiv id=\"rbMsg\" class=\"m\" role=\"status\">\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv id=\"rvModal\" class=\"ov np\" hidden>\u003cdiv class=\"mdl wide\" style=\"max-width:1000px\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"rvT\">\n\u003cdiv class=\"row\" style=\"margin-bottom:6px\">\u003ch2 id=\"rvT\" style=\"margin:0\">\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cbutton id=\"rvXls\" type=\"button\">Unduh Excel\u003c/button>\u003cbutton class=\"s\" id=\"rvClose\" type=\"button\">Tutup\u003c/button>\u003c/div>\n\u003cp class=\"hint\" id=\"rvMeta\" style=\"margin:0 0 10px\">\u003c/p>\n\u003cdiv class=\"stats\" id=\"rvStats\">\u003c/div>\n\u003ch3 style=\"margin:6px 0 6px;font-size:15px\">Rekap per dojo\u003c/h3>\n\u003cdiv class=\"tw\" style=\"max-height:30vh\">\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Dojo\u003c/th>\u003cth>Wilayah\u003c/th>\u003cth class=\"n\">Peserta\u003c/th>\u003cth class=\"n\">Tagihan\u003c/th>\u003cth>Status\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"rvDojo\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin:12px 0 6px\">\u003ch3 style=\"margin:0;font-size:15px\">Daftar peserta\u003c/h3>\u003cspan class=\"sp\">\u003c/span>\u003cinput id=\"rvQ\" placeholder=\"Cari nama / dojo\" style=\"max-width:220px\">\u003c/div>\n\u003cdiv class=\"tw\" style=\"max-height:34vh\">\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003 -1v-3\"/>\u003c/svg>\u003cspan class=\"tl\">Data Upload\u003c/span>\u003c/button>\u003cbutton id=\"tMat\" type=\"button\" hidden>\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/>\u003cpath d=\"M9 4h6v3H9zM9 12h6M9 16h6\"/>\u003c/svg>\u003cspan class=\"tl\">Materi Ujian\u003c/span>\u003c/button>\u003cbutton id=\"tWil\" type=\"button\" hidden>\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z\"/>\u003ccircle cx=\"12\" cy=\"10\" r=\"2.5\"/>\u003c/svg>\u003cspan class=\"tl\">Wilayah\u003c/span>\u003c/button>\u003cbutton id=\"tUjn\" type=\"button\">\u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003crect x=\"5\" y=\"4\" width=\"14\" height=\"17\" rx=\"2\"/>\u003cpath d=\"M9 4h6v3H9zM9 12h6M9 16h6\"/>\u003c/svg>\u003cspan class=\"tl\">Ujian\u003c/span>\u003c/button>\u003c/nav>\n\u003cdiv id=\"vPes\">\n\u003csection class=\"card np dash\" id=\"dash\">\n\u003cdiv class=\"row\" style=\"margin-bottom:12px\">\u003ch2 style=\"margin:0\">Dashboard peserta\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003c/div>\n\u003cdiv class=\"kpis\" id=\"kpis\">\u003c/div>\n\u003cdiv class=\"dg\">\u003cdiv class=\"dc\">\u003ch3>Peserta per tingkat tujuan\u003c/h3>\u003cdiv id=\"dLv\">\u003c/div>\u003c/div>\u003cdiv class=\"dc\">\u003ch3>Peserta per wilayah\u003c/h3>\u003cdiv id=\"dWil\">\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"dc\" style=\"margin-top:12px\">\u003cdiv class=\"row\" style=\"margin-bottom:6px\">\u003ch3 style=\"margin:0\">Peserta per dojo\u003c/h3>\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"s\" id=\"dojAll\" type=\"button\" hidden>\u003c/button>\u003c/div>\u003cdiv id=\"dDoj\">\u003c/div>\u003c/div>\n\u003c/section>\n\u003cdiv id=\"slotPes\">\u003cdiv id=\"pesTools\">\n\u003csection class=\"card np\">\n\u003ch2>Import dari Excel\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003clabel for=\"uDojo\">Nama dojo\u003c/label>\u003cselect id=\"uDojo\">\u003c/select>\u003c/div>\n\u003cdiv>\u003clabel for=\"uNama\">Nama pengupload\u003c/label>\u003cinput id=\"uNama\" placeholder=\"Nama Anda\" autocomplete=\"name\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"drop\" id=\"drop\" style=\"margin-top:10px\">Isi nama dojo dan nama pengupload dulu, lalu tarik file Excel (.xlsx, .xls, .csv) ke sini, atau\n\u003cbutton class=\"p\" id=\"pick\" type=\"button\">Pilih file\u003c/button>\n\u003cinput type=\"file\" id=\"file\" accept=\".xlsx,.xls,.csv\" hidden>\u003c/div>\n\u003cdiv class=\"row\" id=\"xlRow\" style=\"margin-top:8px\" hidden>\u003cbutton class=\"s\" id=\"tplBtn\" type=\"button\">Unduh Template Excel\u003c/button> \u003cbutton class=\"s\" id=\"tplDrv\" type=\"button\" hidden>Template Google Drive (lama)\u003c/button> \u003cbutton class=\"s\" id=\"expBtn\" type=\"button\">Ekspor Data Peserta (format sama)\u003c/button>\u003c/div>\n\u003cp class=\"hint\">Baris pertama harus berisi judul kolom: \u003cb>Nama\u003c/b>, \u003cb>Dojo\u003c/b> (boleh dikosongkan, otomatis memakai dojo yang dipilih di atas), \u003cb>Wilayah\u003c/b>, \u003cb>Tempat Lahir\u003c/b>, \u003cb>Tanggal Lahir\u003c/b>, \u003cb>Tingkat Sekarang\u003c/b>, \u003cb>Tingkat Tujuan\u003c/b>. Format tanggal: 31-12-2010 (hari-bulan-tahun). Template Excel dari tombol di bawah sudah memakai pilihan (dropdown) untuk Dojo, Tingkat Sekarang, dan Tingkat Tujuan agar tidak salah ketik. Dojo harus sudah terdaftar di menu Administrator; Tingkat Tujuan otomatis mengikuti Tingkat Sekarang (mis. Kyu 7 (Putih) menjadi Kyu 6 (Kuning)); bila kosong, sistem mengisinya sendiri. Jika kolom Wilayah kosong, wilayah diisi dari data dojo. Wilayah di file hanya dipakai jika sudah terdaftar di menu Wilayah (pilih dari dropdown di template); isian lain seperti angka \"1\" diabaikan dan memakai wilayah dojo, karena wilayah baru hanya bisa ditambah di menu Wilayah; Pelatih selalu diisi otomatis dari data dojo. Baris yang kolom Dojo-nya berbeda dengan dojo yang dipilih di atas ditolak. Nama yang sama dianggap satu orang: tidak akan dobel, baris kembar di file digabung, dan peserta yang namanya sudah ada otomatis diperbarui dengan isian terbaru dari file (tempat/tanggal lahir, tingkat, wilayah); nama tidak berubah, sel kosong tidak menghapus data lama, dan peserta lain di dojo tidak ikut terhapus. Biaya ujian dan status pembayaran diatur per dojo di menu Administrator. Contoh: \u003ci>Kyu 7 (Putih)\u003c/i> ke \u003ci>Kyu 6 (Kuning)\u003c/i>.\u003c/p>\n\u003cdiv id=\"msg\" role=\"status\">\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:14px;padding-top:14px;border-top:1px solid var(--line)\">\u003cspan class=\"hint\" style=\"margin:0\">Hanya satu atau dua peserta? Isi lewat formulir.\u003c/span>\u003cbutton id=\"addMan\" type=\"button\" style=\"display:inline-flex;align-items:center;gap:6px\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 5v14M5 12h14\"/>\u003c/svg>Tambah Peserta Secara Manual\u003c/button>\u003c/div>\n\u003c/section>\n\n\n\n\n\u003c/div>\u003c/div>\n\n\n\u003csection class=\"card np\" id=\"secBaru\" hidden>\n\u003cdiv class=\"row\" style=\"margin-bottom:6px\">\u003ch2 style=\"margin:0\">Data yang baru saja diupload\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cspan id=\"bSt\">\u003c/span>\u003cbutton class=\"s\" id=\"bClose\" type=\"button\">Tutup\u003c/button>\u003c/div>\n\u003cp class=\"hint\" style=\"margin:0 0 10px\" id=\"bInfo\">\u003c/p>\n\u003cdiv class=\"tw\" style=\"max-height:340px;overflow:auto\">\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Nama\u003c/th>\u003cth>Tempat, tanggal lahir\u003c/th>\u003cth>Tingkat sekarang\u003c/th>\u003cth>Tingkat tujuan\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"bTb\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"secList\">\n\u003cdiv class=\"kop pr\">\u003ch1 id=\"pNama\">\u003c/h1>\u003cp id=\"pMeta\">\u003c/p>\u003cp>\u003cb id=\"pDoj\">\u003c/b>\u003c/p>\u003c/div>\n\u003cdiv class=\"row np\" style=\"margin-bottom:12px\">\n\u003ch2 style=\"margin:0\">Kelola daftar peserta\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\n\u003cselect id=\"lDojo\" style=\"max-width:220px\" aria-label=\"Pilih dojo\">\u003c/select>\n\u003cinput id=\"q\" placeholder=\"Cari nama / dojo\" style=\"max-width:200px\">\n\u003cbutton class=\"p\" id=\"print\" type=\"button\">Cetak daftar\u003c/button>\n\n\u003c/div>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Nama\u003c/th>\u003cth>Dojo\u003c/th>\u003cth>Wilayah\u003c/th>\u003cth>Pelatih\u003c/th>\u003cth>Tempat, tanggal lahir\u003c/th>\u003cth>Tingkat sekarang\u003c/th>\u003cth>Tingkat tujuan\u003c/th>\u003cth class=\"col-a np\">Aksi\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody id=\"tb\">\u003c/tbody>\u003ctfoot id=\"tf\">\u003c/tfoot>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"pr sign\">\u003cdiv>Panitia\u003cspan>(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)\u003c/span>\u003c/div>\u003cdiv>Bendahara\u003cspan>(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"secKP\">\u003cdiv id=\"kpBody\">\u003c/div>\u003c/section>\n\u003c/div>\n\u003cdiv id=\"vDoj\" hidden>\n\u003csection class=\"card np\" id=\"secUpList\" hidden>\n\u003ch2 style=\"margin-bottom:4px\">Dojo yang sudah upload\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 10px\" id=\"ulInfo\">\u003c/p>\n\u003cdiv id=\"ulBody\">\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"secDet\">\n\u003cdiv class=\"kop pr\">\u003ch1 id=\"dtNama\">\u003c/h1>\u003cp id=\"dtMeta\">\u003c/p>\u003cp>\u003cb id=\"dtJudul\">\u003c/b>\u003c/p>\u003c/div>\n\u003cdiv class=\"np\" style=\"margin-bottom:12px\">\u003clabel for=\"dSel\">Pilih dojo yang sudah masuk rekapan untuk melihat data peserta, setoran, status bayar, dan kwitansi\u003c/label>\u003cselect id=\"dSel\" style=\"max-width:380px\">\u003c/select>\u003c/div>\n\u003cdiv id=\"dtBody\">\u003c/div>\n\u003c/section>\n\u003csection class=\"card np\" id=\"secBADoj\" hidden>\u003ch2 id=\"baTD\">Berita acara dojo\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 12px\">Berita acara penyetoran biaya ujian dojo ini sudah terisi otomatis: kop surat dari info ujian, penyetor dari nama pelatih dojo, serta periode, tanggal, dan penerima dari pengaturan di menu Administrator. Tinggal klik Cetak atau Simpan PDF; dokumen baru dibuat saat tombol ditekan.\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton class=\"p\" id=\"baPD\" type=\"button\">Cetak berita acara\u003c/button>\u003cbutton id=\"baDD\" type=\"button\">Simpan PDF\u003c/button>\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"secRekap\">\n\u003cdiv class=\"kop pr\">\u003ch1 id=\"rNama\">\u003c/h1>\u003cp id=\"rMeta\">\u003c/p>\u003cp>\u003cb>Rekap Pembayaran per Dojo\u003c/b>\u003c/p>\u003c/div>\n\u003cdiv class=\"row np\" style=\"margin-bottom:12px\">\u003ch2 style=\"margin:0\">Rekap pembayaran per dojo\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"p\" id=\"printRekap\" type=\"button\">Cetak rekap\u003c/button>\u003c/div>\n\u003cp class=\"hint np\" style=\"margin:0 0 10px\">Jumlah peserta tiap dojo ada di kolom Peserta. Klik Kwitansi untuk mencetak kwitansi pembayaran dojo tersebut.\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Dojo\u003c/th>\u003cth>Wilayah\u003c/th>\u003cth>Pelatih\u003c/th>\u003cth class=\"n\">Peserta\u003c/th>\u003cth class=\"n\">Biaya ujian\u003c/th>\u003cth class=\"n\">Total tagihan\u003c/th>\u003cth class=\"n\">Sudah dibayar\u003c/th>\u003cth class=\"n\">Belum dibayar\u003c/th>\u003cth class=\"np\">Aksi\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody id=\"rb\">\u003c/tbody>\u003ctfoot id=\"rf\">\u003c/tfoot>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"pr sign\">\u003cdiv>Panitia\u003cspan>(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)\u003c/span>\u003c/div>\u003cdiv>Bendahara\u003cspan>(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"secKw\">\n\u003cdiv class=\"kop\">\u003ch1 id=\"kwNama\">\u003c/h1>\u003cp id=\"kwMeta\">\u003c/p>\u003cp>\u003cb>KWITANSI PEMBAYARAN\u003c/b>\u003c/p>\u003c/div>\n\u003cdiv id=\"kwBody\">\u003c/div>\n\u003c/section>\n\u003c/div>\n\u003cdiv id=\"vAdm\" hidden>\n\u003csection class=\"card np\">\n\u003ch2>Info ujian\u003c/h2>\n\u003cp class=\"hint\" id=\"iLock\" hidden style=\"margin:0 0 10px\">Diisi otomatis dari Dojoku pusat (menu \u003cb>Kegiatan &gt; UKT\u003c/b>) dan tidak bisa diubah di sini. Untuk mengganti judul, tanggal, tempat, atau penyelenggara, ubah kegiatan UKT di Dojoku pusat.\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003clabel for=\"iNama\">Nama kegiatan\u003c/label>\u003cinput id=\"iNama\" placeholder=\"Ujian Kenaikan Tingkat Periode I\">\u003c/div>\n\u003cdiv>\u003clabel for=\"iTgl\">Tanggal\u003c/label>\u003cinput id=\"iTgl\" type=\"date\">\u003c/div>\n\u003cdiv>\u003clabel for=\"iTempat\">Tempat\u003c/label>\u003cinput id=\"iTempat\" placeholder=\"Dojo / GOR\">\u003c/div>\n\u003cdiv>\u003clabel for=\"iOrg\">Penyelenggara\u003c/label>\u003cinput id=\"iOrg\" placeholder=\"Nama perguruan\">\u003c/div>\n\u003cdiv>\u003clabel for=\"iTpl\">Link template Excel (Google Drive)\u003c/label>\u003cinput id=\"iTpl\" type=\"url\" placeholder=\"https://drive.google.com/file/d/...\">\u003c/div>\n\u003c/div>\n\u003c/section>\n\u003csection class=\"card np\" id=\"secRw\">\u003ch2>Riwayat acara UKT\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 12px\">Setelah sebuah acara UKT selesai, simpan datanya ke riwayat (judul, peserta, dojo, setoran, dan pengeluaran). Untuk acara berikutnya, tambahkan dulu kegiatan UKT baru di Dojoku pusat (menu \u003cb>Kegiatan &gt; UKT\u003c/b>), lalu klik \u003cb>Buat acara UKT baru\u003c/b> di sini: data acara berjalan diarsipkan otomatis, peserta, setoran, dan pengeluaran dikosongkan, dan Info ujian mengikuti kegiatan baru dari pusat. Daftar dojo, materi ujian, wilayah, dan template tetap dipakai.\u003c/p>\n\u003cdiv id=\"rwBanner\">\u003c/div>\n\u003cdiv id=\"rwAktif\">\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"p\" id=\"rwArsip\" type=\"button\">Arsipkan acara ini ke riwayat\u003c/button>\u003cbutton id=\"rwBaru\" type=\"button\">Buat acara UKT baru\u003c/button>\u003c/div>\n\u003cdiv id=\"rwMsg\" class=\"m\" role=\"status\">\u003c/div>\n\u003ch3 style=\"margin:16px 0 0;font-size:15px\" id=\"rwHead\">Arsip acara\u003c/h3>\n\u003cdiv id=\"rwList\">\u003c/div>\n\u003c/section>\n\u003csection class=\"card np\" id=\"secBAAdm\">\u003ch2>Berita acara setoran UKT (seluruh dojo)\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 12px\">Berita acara penyetoran biaya ujian untuk semua peserta di semua dojo. Isian di bawah tersimpan otomatis (dokumen tidak ditampilkan di halaman agar ringan; dokumen dibuat saat Anda klik Cetak atau Simpan PDF) dan dipakai juga oleh berita acara per dojo di menu Dojo, sehingga pelatih dojo tidak perlu mengisi lagi. Kop surat memakai Nama kegiatan, Penyelenggara, Tempat, dan Tanggal dari kartu Info ujian (serta logo jika sudah dipasang). Jumlah peserta per tingkat dihitung otomatis dari kolom \u003cb>Tingkat Tujuan\u003c/b>.\u003c/p>\n\u003cdiv class=\"grid\" id=\"baFA\">\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"p\" id=\"baPA\" type=\"button\">Cetak berita acara\u003c/button>\u003cbutton id=\"baDA\" type=\"button\">Simpan PDF\u003c/button>\u003c/div>\n\u003c/section>\n\u003csection class=\"card np\" id=\"secBAAll\">\u003ch2>Berita acara semua dojo (sekali unduh)\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 12px\">Satu klik membuat berita acara penyetoran untuk \u003cb>setiap dojo\u003c/b> yang punya peserta, lalu mengunduhnya sebagai satu file ZIP berisi satu PDF per dojo (mis. \u003ci>Berita_Acara_UKT_Nama_Dojo.pdf\u003c/i>), siap Anda kirim ke masing-masing dojo. Isi tiap berita acara (jumlah peserta per tingkat, nominal, penyetor dari nama pelatih dojo) sama dengan tombol Cetak/Simpan PDF di menu Dojo, dan memakai isian Periode, Tahun, Kota, Tanggal, dan Penerima dari kartu di atas. Dojo yang belum punya peserta dilewati.\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton class=\"p\" id=\"baAllZ\" type=\"button\">Unduh berita acara semua dojo (ZIP)\u003c/button>\u003c/div>\n\u003cdiv id=\"baAllMsg\" class=\"m\" role=\"status\">\u003c/div>\n\u003c/section>\n\u003csection class=\"card np\">\u003ch2>Backup data\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 12px\">Ada dua cara menyimpan backup: \u003cb>unduh langsung ke perangkat\u003c/b> (tanpa email), atau kirim lewat email. Backup berisi semua peserta, dojo, info ujian, dan setoran/keuangan.\u003c/p>\n\u003ch3 style=\"margin:0 0 6px;font-size:15px\">Pilihan 1: Unduh ke perangkat (tanpa email)\u003c/h3>\n\u003cdiv class=\"row\">\u003cbutton class=\"p\" id=\"bkSave\" type=\"button\">Unduh Backup (.json)\u003c/button> \u003cbutton class=\"s\" id=\"bkXlsx\" type=\"button\">Unduh Semua Data (.xlsx)\u003c/button> \u003cbutton class=\"s\" id=\"bkRestore\" type=\"button\">Pulihkan dari file backup\u003c/button>\u003cinput type=\"file\" id=\"bkFile\" accept=\".json\" hidden>\u003c/div>\n\u003cp class=\"hint\" style=\"margin:6px 0 14px\">File .json dipakai untuk memulihkan data ke aplikasi ini. File .xlsx berisi data lengkap (peserta, dojo, pengeluaran) untuk dibuka di Excel, tetapi tidak bisa dipulihkan.\u003c/p>\n\u003ch3 style=\"margin:0 0 6px;font-size:15px\">Pilihan 2: Kirim lewat email\u003c/h3>\n\u003cdiv class=\"grid\">\u003cdiv>\u003clabel for=\"bkMail\">Email tujuan backup\u003c/label>\u003cinput id=\"bkMail\" type=\"email\" placeholder=\"nama@email.com\">\u003c/div>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cbutton id=\"bkSend\" type=\"button\">Kirim Backup via Email\u003c/button>\u003c/div>\n\u003cp class=\"hint\" style=\"margin:6px 0 0\">Tombol ini mengunduh file backup lalu membuka aplikasi email dengan pesan siap kirim. \u003cb>Lampirkan file yang baru diunduh\u003c/b> sebelum menekan kirim; halaman ini tidak bisa mengirim email atau melampirkan file otomatis.\u003c/p>\n\u003cdiv id=\"bkMsg\" role=\"status\" class=\"hint\" style=\"margin-top:8px\">\u003c/div>\n\u003c/section>\n\u003csection class=\"card np\" id=\"secDojoXl\">\n\u003ch2>Import dojo dari Excel\u003c/h2>\n\u003cdiv class=\"drop\" id=\"dDrop\">Tarik file Excel (.xlsx, .xls, .csv) ke sini, atau\n\u003cbutton class=\"p\" id=\"dPick\" type=\"button\">Pilih file\u003c/button>\n\u003cinput type=\"file\" id=\"dFile\" accept=\".xlsx,.xls,.csv\" hidden>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton class=\"s\" id=\"dTpl\" type=\"button\">Unduh Template Dojo\u003c/button> \u003cbutton class=\"s\" id=\"dExp\" type=\"button\">Ekspor Data Dojo (format sama)\u003c/button>\u003c/div>\n\u003cp class=\"hint\">Baris pertama harus berisi judul kolom: \u003cb>Nama Dojo\u003c/b>, \u003cb>Wilayah\u003c/b>, \u003cb>Nama Pelatih\u003c/b>, \u003cb>Kontak\u003c/b>, \u003cb>Email Pelatih\u003c/b>, \u003cb>Biaya Ujian\u003c/b>, \u003cb>Status Pembayaran\u003c/b>. Kolom \u003cb>Nama Dojo\u003c/b>, \u003cb>Wilayah\u003c/b>, dan \u003cb>Nama Pelatih\u003c/b> wajib diisi; kolom lain boleh kosong. Status diisi \u003cb>Belum\u003c/b> atau \u003cb>Lunas\u003c/b> (kosong dianggap Belum).\u003c/p>\n\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003clabel class=\"row\" style=\"margin:0\">\u003cinput type=\"checkbox\" id=\"dUpd\" style=\"width:auto\"> Perbarui dojo yang namanya sudah terdaftar (tanpa ini, dojo yang sudah ada dilewati)\u003c/label>\u003c/div>\n\u003cdiv id=\"dMsg\" class=\"m\" role=\"status\">\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:14px;padding-top:14px;border-top:1px solid var(--line)\">\u003cspan class=\"hint\" style=\"margin:0\">Hanya satu atau dua dojo? Isi lewat formulir.\u003c/span>\u003cbutton id=\"dAddMan\" type=\"button\" style=\"display:inline-flex;align-items:center;gap:6px\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 5v14M5 12h14\"/>\u003c/svg>Tambah Dojo Secara Manual\u003c/button>\u003c/div>\n\u003c/section>\n\u003csection class=\"card np\">\u003cdiv class=\"row\">\u003ch2 style=\"margin:0\">Dojo terdaftar\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"p\" id=\"dojoOpen\" type=\"button\">Lihat daftar dojo\u003c/button>\u003c/div>\n\u003cp class=\"hint\" id=\"dojoSum\" style=\"margin:8px 0 0\">\u003c/p>\n\u003c/section>\n\u003csection class=\"card np\" id=\"secKelola\">\u003cdiv class=\"row\">\u003ch2 style=\"margin:0\">Kelola peserta\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"p\" id=\"kelolaOpen\" type=\"button\">Kelola peserta\u003c/button>\u003c/div>\n\u003cp class=\"hint\" id=\"kelolaSum\" style=\"margin:8px 0 0\">\u003c/p>\n\u003c/section>\n\u003c/div>\n\u003cdiv id=\"vNot\" hidden>\n\u003csection class=\"card np\">\u003ch2>Permintaan penghapusan peserta\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 12px\">Permintaan dari pengguna yang belum login. Setujui untuk menghapus peserta, atau tolak untuk membiarkan datanya.\u003c/p>\n\u003cdiv id=\"nList\">\u003c/div>\u003c/section>\n\u003csection class=\"card np\">\u003ch2>Riwayat keputusan\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Diputuskan\u003c/th>\u003cth>Peserta\u003c/th>\u003cth>Dojo\u003c/th>\u003cth>Keputusan\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"nHist\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003c/div>\n\u003cdiv id=\"vUp\" hidden>\n\u003csection class=\"card np\">\u003ch2>Data &amp; file upload\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 12px\">Riwayat import Excel peserta: siapa yang mengupload, untuk dojo mana, kapan, dan file aslinya. Klik Lihat untuk membuka isi file, atau Unduh untuk menyimpan file aslinya.\u003c/p>\n\u003cdiv class=\"sqlbox\" id=\"upSql\" hidden>\u003cb>Arsip upload belum aktif di database.\u003c/b> Jalankan SQL ini di database (SQL Editor), lalu muat ulang halaman. Selama belum dijalankan, riwayat upload hanya tampil di sesi ini.\n\u003cpre>create table if not exists bkc_upload (\n  id text primary key,\n  data jsonb not null,\n  created_at timestamptz default now(),\n  updated_at timestamptz default now()\n);\nalter table bkc_upload add column if not exists dojo text generated always as (data-&gt;&gt;'dojo') stored;\nalter table bkc_upload add column if not exists pengupload text generated always as (data-&gt;&gt;'nama') stored;\nalter table bkc_upload add column if not exists nama_file text generated always as (data-&gt;&gt;'file') stored;\nalter table bkc_upload add column if not exists peserta_masuk integer generated always as ((data-&gt;&gt;'masuk')::integer) stored;\nalter table bkc_upload add column if not exists baris_ditolak integer generated always as ((data-&gt;&gt;'ditolak')::integer) stored;\nalter table bkc_upload add column if not exists status text generated always as (data-&gt;&gt;'status') stored;\nalter table bkc_upload enable row level security;\ndrop policy if exists \"upload_insert\" on bkc_upload;\ndrop policy if exists \"upload_select\" on bkc_upload;\ndrop policy if exists \"upload_update\" on bkc_upload;\ndrop policy if exists \"upload_delete\" on bkc_upload;\ncreate policy \"upload_insert\" on bkc_upload for insert to anon, authenticated with check (true);\ncreate policy \"upload_select\" on bkc_upload for select to authenticated using (true);\ncreate policy \"upload_update\" on bkc_upload for update to authenticated using (true) with check (true);\ncreate policy \"upload_delete\" on bkc_upload for delete to authenticated using (true);\ngrant insert on bkc_upload to anon;\ngrant select, insert, update, delete on bkc_upload to authenticated;\u003c/pre>\n\u003cspan class=\"hint\">SQL lengkap semua tabel (peserta, dojo, profil, dll.) ada di file \u003cb>database.sql\u003c/b>.\u003c/span>\u003c/div>\n\u003cdiv class=\"stats\" id=\"upStats\">\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-bottom:10px\">\u003cselect id=\"upDojo\" style=\"max-width:240px\">\u003c/select>\u003cinput id=\"upQ\" placeholder=\"Cari pengupload / nama file\" style=\"max-width:240px\">\u003c/div>\n\u003cp class=\"hint\" id=\"upNote\" style=\"margin:0 0 10px\" hidden>\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Waktu upload\u003c/th>\u003cth>Nama dojo\u003c/th>\u003cth>Pengupload\u003c/th>\u003cth>Nama file\u003c/th>\u003cth class=\"n\">Masuk\u003c/th>\u003cth class=\"n\">Ditolak\u003c/th>\u003cth>Status\u003c/th>\u003cth>Aksi\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"upB\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003c/section>\u003c/div>\n\u003cdiv id=\"vMat\" hidden>\n\u003csection class=\"card np\">\u003ch2>Tambah materi ujian\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 12px\">Pilih sabuk dari dropdown, isi kategori, lalu tulis materinya. Boleh banyak sekaligus: satu materi per baris.\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003clabel for=\"mtSab\">Sabuk / tingkat\u003c/label>\u003cselect id=\"mtSab\">\u003c/select>\u003c/div>\n\u003cdiv>\u003clabel for=\"mtKat\">Kategori\u003c/label>\u003cinput id=\"mtKat\" list=\"mtk\" placeholder=\"Penguatan Dasar / Kihon / Kata / Kumite\">\u003c/div>\n\u003c/div>\n\u003cdatalist id=\"mtk\">\u003coption>Penguatan Dasar\u003coption>Kihon\u003coption>Kata\u003coption>Kumite\u003coption>Lainnya\u003c/datalist>\n\u003cdiv style=\"margin-top:10px\">\u003clabel for=\"mtNm\">Materi (satu per baris)\u003c/label>\u003ctextarea id=\"mtNm\" rows=\"4\" placeholder=\"Contoh:&#10;Oi Zuki&#10;Gedan Barai\">\u003c/textarea>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"p\" id=\"mtAdd\" type=\"button\">Tambah materi\u003c/button>\u003c/div>\n\u003cdiv id=\"mtMsg\" class=\"m\" role=\"status\">\u003c/div>\n\u003c/section>\n\u003csection class=\"card np\">\u003ch2>Import materi dari Excel\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 10px\">Praktis untuk memasukkan atau memperbarui banyak materi sekaligus, misalnya saat ada perubahan materi. Unduh template, isi, lalu upload. Kolom template: \u003cb>Sabuk\u003c/b>, \u003cb>Kategori\u003c/b>, \u003cb>Materi\u003c/b>. File hasil ekspor dari menu ini juga bisa diimport kembali.\u003c/p>\n\u003cdiv class=\"drop\" id=\"mtDrop\">Tarik file Excel (.xlsx, .xls, .csv) ke sini, atau\n\u003cbutton class=\"p\" id=\"mtPick\" type=\"button\">Pilih file\u003c/button>\n\u003cinput type=\"file\" id=\"mtFile\" accept=\".xlsx,.xls,.csv\" hidden>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton class=\"s\" id=\"mtTpl\" type=\"button\">Unduh Template Materi\u003c/button> \u003cbutton class=\"s\" id=\"mtExp\" type=\"button\">Ekspor Materi (format sama)\u003c/button>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003clabel class=\"row\" style=\"margin:0\">\u003cinput type=\"checkbox\" id=\"mtRep\" style=\"width:auto\"> Ganti materi untuk sabuk yang ada di file (tanpa ini, materi baru ditambahkan dan yang sudah ada dilewati)\u003c/label>\u003c/div>\n\u003cdiv id=\"mtImpMsg\" class=\"m\" role=\"status\">\u003c/div>\n\u003c/section>\n\u003csection class=\"card np\">\u003cdiv class=\"row\">\u003ch2 style=\"margin:0\">Materi ujian\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"p\" id=\"mtOpen\" type=\"button\">Lihat materi ujian\u003c/button>\u003c/div>\n\u003cp class=\"hint\" id=\"mtSum\" style=\"margin:8px 0 0\">\u003c/p>\n\u003c/section>\n\u003csection class=\"pr\" id=\"secMat\">\n\u003cdiv class=\"kop pr\">\u003ch1 id=\"mpNama\">\u003c/h1>\u003cp id=\"mpMeta\">\u003c/p>\u003cp>\u003cb>Lembar Materi dan Penilaian Ujian\u003c/b>\u003c/p>\u003c/div>\n\u003cdiv class=\"lgd\">\u003cb>Keterangan nilai:\u003c/b>\u003cspan>\u003cspan class=\"nk gm\">M\u003c/span> Memuaskan\u003c/span>\u003cspan>\u003cspan class=\"nk gb\">B\u003c/span> Baik\u003c/span>\u003cspan>\u003cspan class=\"nk gcb\">CB\u003c/span> Cukup Baik\u003c/span>\u003cspan>\u003cspan class=\"nk gc\">C\u003c/span> Cukup\u003c/span>\u003c/div>\n\u003cdiv id=\"mpBody\">\u003c/div>\n\u003cdiv class=\"pr sign\">\u003cdiv>Penguji\u003cspan>(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)\u003c/span>\u003c/div>\u003cdiv>Panitia\u003cspan>(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\u003c/div>\n\u003cdiv id=\"vWil\" hidden>\n\u003csection class=\"card np\">\u003ch2>Data wilayah\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 12px\">Pilih wilayah untuk mengisi susunan pengurusnya (Ketua, Sekretaris, Bendahara) dan melihat dojo, peserta, serta berita acara wilayah itu. Daftar wilayah diambil otomatis dari data dojo; wilayah baru juga bisa ditambahkan di sini.\u003c/p>\n\u003cdiv class=\"row\" style=\"margin-bottom:12px\">\u003cselect id=\"wlSel\" style=\"max-width:340px\" aria-label=\"Pilih wilayah\">\u003c/select>\u003cbutton id=\"wlNew\" type=\"button\">Wilayah baru\u003c/button>\u003c/div>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003clabel for=\"wlNama\">Nama wilayah\u003c/label>\u003cinput id=\"wlNama\" placeholder=\"mis. Kabupaten Bogor\">\u003c/div>\n\u003cdiv>\u003clabel for=\"wlKetua\">Ketua\u003c/label>\u003cinput id=\"wlKetua\" placeholder=\"Nama ketua\">\u003c/div>\n\u003cdiv>\u003clabel for=\"wlSek\">Sekretaris\u003c/label>\u003cinput id=\"wlSek\" placeholder=\"Nama sekretaris\">\u003c/div>\n\u003cdiv>\u003clabel for=\"wlBen\">Bendahara\u003c/label>\u003cinput id=\"wlBen\" placeholder=\"Nama bendahara\">\u003c/div>\n\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"p\" id=\"wlSave\" type=\"button\">Simpan data wilayah\u003c/button>\u003cbutton id=\"wlDel\" type=\"button\" hidden style=\"color:var(--red);border-color:var(--red)\">Hapus data pengurus\u003c/button>\u003c/div>\n\u003cdiv id=\"wlMsg\" class=\"m\" role=\"status\">\u003c/div>\n\u003c/section>\n\u003csection class=\"card np\">\u003ch2>Ringkasan semua wilayah\u003c/h2>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Wilayah\u003c/th>\u003cth>Ketua\u003c/th>\u003cth>Sekretaris\u003c/th>\u003cth>Bendahara\u003c/th>\u003cth class=\"n\">Dojo\u003c/th>\u003cth class=\"n\">Peserta\u003c/th>\u003cth>Aksi\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"wlRekap\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003cdiv id=\"wlDet\" hidden>\n\u003csection class=\"card np\">\u003ch2 id=\"wlDojT\">Dojo di wilayah\u003c/h2>\n\u003cp class=\"hint\" style=\"margin:0 0 10px\" id=\"wlPeng\">\u003c/p>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Dojo\u003c/th>\u003cth>Pelatih\u003c/th>\u003cth>Kontak\u003c/th>\u003cth class=\"n\">Peserta\u003c/th>\u003cth>Status bayar\u003c/th>\u003cth>Aksi\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"wlDoj\">\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection class=\"card np\" id=\"wlPes lass=\"hint np\" style=\"margin:0 0 12px\">Pilih sabuk yang akan diujikan, lalu unduh untuk bahan latihan. Nilai ujian terdiri dari empat tingkat: M (Memuaskan), B (Baik), CB (Cukup Baik), dan C (Cukup).\u003c/p>\n\u003cdiv class=\"lgd\">\u003cb>Keterangan nilai:\u003c/b>\u003cspan>\u003cspan class=\"nk gm\">M\u003c/span> Memuaskan\u003c/span>\u003cspan>\u003cspan class=\"nk gb\">B\u003c/span> Baik\u003c/span>\u003cspan>\u003cspan class=\"nk gcb\">CB\u003c/span> Cukup Baik\u003c/span>\u003cspan>\u003cspan class=\"nk gc\">C\u003c/span> Cukup\u003c/span>\u003c/div>\n\u003cdiv id=\"gtBody\">\u003c/div>\n\u003c/section>\u003c/div>\n\u003cdiv id=\"vPro\" hidden>\n\u003csection class=\"card np\">\u003ch2>Profile\u003c/h2>\n\u003cdiv class=\"row\" style=\"margin-bottom:12px\">\u003cdiv class=\"av big\" id=\"prAv\">\u003c/div>\u003cdiv>\u003cbutton class=\"s\" id=\"prFotoBtn\" type=\"button\">Ganti foto\u003c/button>\u003cinput type=\"file\" id=\"prFoto\" accept=\"image/*\" hidden>\u003c/div>\u003c/div>\n\u003cdiv class=\"grid\">\u003cdiv>\u003clabel for=\"prNama\">Nama profile\u003c/label>\u003cinput id=\"prNama\">\u003c/div>\u003cdiv>\u003clabel for=\"prUser\">Username login\u003c/label>\u003cinput id=\"prUser\" autocapitalize=\"none\" spellcheck=\"false\">\u003c/div>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"p\" id=\"prSave\" type=\"button\">Simpan profile\u003c/button>\u003c/div>\u003cdiv id=\"pm1\" class=\"m\" role=\"status\">\u003c/div>\u003c/section>\n\u003csection class=\"card np\">\u003ch2>Email login\u003c/h2>\u003cdiv class=\"grid\">\u003cdiv>\u003clabel for=\"prEmail\">Email\u003c/label>\u003cinput id=\"prEmail\" type=\"email\">\u003c/div>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"p\" id=\"prEmailBtn\" type=\"button\">Ubah email\u003c/button>\u003c/div>\u003cdiv id=\"pm2\" class=\"m\" role=\"status\">\u003c/div>\u003c/section>\n\u003csection class=\"card np\">\u003ch2>Kata sandi\u003c/h2>\u003cdiv class=\"grid\">\u003cdiv>\u003clabel for=\"prOld\">Kata sandi saat ini\u003c/label>\u003cinput id=\"prOld\" type=\"password\" autocomplete=\"current-password\">\u003c/div>\u003cdiv>\u003clabel for=\"prNew\">Kata sandi baru\u003c/label>\u003cinput id=\"prNew\" type=\"password\" autocomplete=\"new-password\">\u003c/div>\u003cdiv>\u003clabel for=\"prNew2\">Ulangi kata sandi baru\u003c/label>\u003cinput id=\"prNew2\" type=\"password\" autocomplete=\"new-password\">\u003c/div>\u003c/div>\n\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"p\" id=\"prPassBtn\" type=\"button\">Ubah kata sandi\u003c/button>\u003c/div>\u003cdiv id=\"pm3\" class=\"m\" role=\"status\">\u003c/div>\u003c/section>\n\u003c/div>\n\u003cdiv id=\"vSet\" hidden>\n\u003cdiv class=\"stats np\" id=\"stats\">\u003c/div>\n\u003csection class=\"card np\">\n\u003ch2 id=\"kTitle\">Input pengeluaran\u003c/h2>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003clabel for=\"kTgl\">Tanggal\u003c/label>\u003cinput id=\"kTgl\" type=\"date\">\u003c/div>\n\u003cdiv>\u003clabel for=\"kKet\">Keterangan\u003c/label>\u003cinput id=\"kKet\" placeholder=\"mis. Konsumsi penguji\">\u003c/div>\n\u003cdiv>\u003clabel for=\"kKat\">Kategori\u003c/label>\u003cinput id=\"kKat\" list=\"kk\">\u003c/div>\n\u003cdiv>\u003clabel for=\"kJml\">Jumlah (Rp)\u003c/label>\u003cinput id=\"kJml\" type=\"number\" min=\"0\">\u003c/div>\n\u003cdiv>\u003clabel for=\"kPen\">Dibayarkan kepada (penerima)\u003c/label>\u003cinput id=\"kPen\" placeholder=\"mis. CV Sumber Rejeki\">\u003c/div>\n\u003cdiv>\u003clabel for=\"kBen\">Dikeluarkan oleh (Bendahara)\u003c/label>\u003cinput id=\"kBen\" placeholder=\"Nama bendahara\">\u003c/div>\n\u003cdiv style=\"grid-column:1/-1\">\u003clabel for=\"kCat\">Catatan (opsional)\u003c/label>\u003cinput id=\"kCat\" placeholder=\"mis. No. nota toko, rincian barang\">\u003c/div>\n\u003c/div>\n\u003cdatalist id=\"kk\">\u003coption>Konsumsi\u003coption>Sertifikat dan sabuk\u003coption>Sewa tempat\u003coption>Honor penguji\u003coption>Transportasi\u003coption>Perlengkapan\u003coption>Lain-lain\u003c/datalist>\n\u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"p\" id=\"kSave\" type=\"button\">Simpan pengeluaran\u003c/button>\u003cspan id=\"kMsg\" class=\"m e\" role=\"alert\">\u003c/span>\u003cbutton id=\"kCancel\" type=\"button\" hidden>Batal edit\u003c/button>\u003c/div>\n\u003cdiv style=\"margin-top:18px;max-width:320px\">\u003clabel for=\"iTarif\">Setoran ke cabang per peserta (Rp)\u003c/label>\u003cinput id=\"iTarif\" type=\"number\" min=\"0\">\u003c/div>\n\u003cp class=\"hint\">Setoran ke cabang dihitung dari jumlah peserta tiap dojo dikali nominal ini.\u003c/p>\n\u003c/section>\n\u003csection class=\"card\" id=\"secLap\">\n\u003cdiv class=\"kop pr\">\u003ch1 id=\"lNama\">\u003c/h1>\u003cp id=\"lMeta\">\u003c/p>\u003cp>\u003cb>Laporan Setoran dan Keuangan\u003c/b>\u003c/p>\u003c/div>\n\u003cdiv class=\"row np\" style=\"margin-bottom:4px\">\u003ch2 style=\"margin:0\">Laporan setoran dan keuangan\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cbutton id=\"openKl\" type=\"button\">Lihat semua kwitansi\u003c/button>\u003cbutton id=\"printKwAll\" type=\"button\">Cetak semua kwitansi\u003c/button>\u003cbutton class=\"p\" id=\"printLap\" type=\"button\">Cetak laporan\u003c/button>\u003c/div>\n\u003ch3>Setoran ke cabang per dojo\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>Dojo\u003c/th>\u003cth>Wilayah\u003c/th>\u003cth class=\"n\">Peserta\u003c/th>\u003cth class=\"n\">Total tagihan\u003c/th>\u003cth class=\"n\">Sudah dibayar\u003c/th>\u003cth class=\"n\">Setoran ke cabang\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"sb\">\u003c/tbody>\u003ctfoot id=\"sf\">\u003c/tfoot>\u003c/table>\u003c/div>\n\u003ch3>Daftar pengeluaran\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>No\u003c/th>\u003cth>No. kwitansi\u003c/th>\u003cth>Tanggal\u003c/th>\u003cth>Keterangan\u003c/th>\u003cth>Penerima\u003c/th>\u003cth>Kategori\u003c/th>\u003cth class=\"n\">Jumlah\u003c/th>\u003cth class=\"np\">Aksi\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"kb\">\u003c/tbody>\u003ctfoot id=\"kf\">\u003c/tfoot>\u003c/table>\u003c/div>\n\u003ch3>Ringkasan keuangan\u003c/h3>\n\u003cdiv class=\"tw\">\u003ctable>\u003ctbody id=\"ring\">\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"pr sign\">\u003cdiv>Panitia\u003cspan>(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)\u003c/span>\u003c/div>\u003cdiv>Bendahara\u003cspan>(&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;)\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\u003csection class=\"card\" id=\"secKP\">\u003cdiv id=\"kpBody\">\u003c/div>\u003c/section>\n\u003c/div>\n\u003c/div>\n\u003cfooter class=\"credit np\">Create by : Diva Hizbullah, S.Kom\u003c/footer>\n\n\u003cscript>\n// ===== Sinkronisasi database (Firebase Firestore milik Dojoku, koleksi \"dojoku\", dokumen ukt_*) =====\nvar Cloud=(()=>{\n const ADM=window.UKT_MODE===\"a\",KEYS=[\"data\",\"dojos\",\"keluar\",\"req\",\"up\",\"riwayat\"],WK=ADM?KEYS:[\"data\",\"req\",\"up\"],J=JSON.stringify,CH=300000,P=\"ukt_\",$=id=>document.getElementById(id);\n let db=null,api=null,ready=false,base=null,baseRev=0,timer=null,running=null,retry=null,step=\"\",unsub=null,going=false,vis=false,wait=10000;\n const by=Math.random().toString(36).slice(2)+Date.now().toString(36);\n const nid=()=>Date.now()+Math.random().toString(36).slice(2,8);\n const cl=x=>JSON.parse(JSON.stringify(x)),empty=()=>({data:[],dojos:[],keluar:[],req:[],up:[],riwayat:[],info:{},logo:\"\"});\n const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};\n function badge(t,s,tip){const b=$(\"cloudBadge\");if(b){b.textContent=t;b.dataset.s=s;b.title=tip||\"\"}}\n const ref=()=>db.collection(\"dojoku\"),meta=()=>ref().doc(P+\"meta\");\n  // waktu server (sama seperti Dojoku); jatuh ke Date.now() bila tidak tersedia\n  const stamp=()=>{try{return window.parent.firebase.firestore.FieldValue.serverTimestamp()}catch(e){return Date.now()}};\n  // potong data jadi bagian \u003c= CH karakter tanpa memenggal pasangan surrogate (emoji)\n  const chunks=s=>{const o=[];let i=0;while(i\u003cs.length){let e=Math.min(i+CH,s.length);if(e\u003cs.length){const c=s.charCodeAt(e-1);if(c>=0xD800&&c\u003c=0xDBFF)e--}o.push(s.slice(i,e));i=e}return o.length?o:[\"\"]};\n  const rng=n=>n>1?P+\"c0 sampai \"+P+\"c\"+(n-1):P+\"c0\";\n  // batas permintaan Firestore 10 MiB: beri pesan jelas daripada gagal samar\n  const big=s=>{if(s.length>3.2e6&&new TextEncoder().encode(s).length>9.5e6){const e=new Error(\"Data UKT terlalu besar untuk sekali simpan (batas sekitar 9,5 MB). Hapus riwayat upload lama di menu Data Upload.\");e.code=\"invalid-argument\";throw e}};\n const po=o=>{try{const P=window.parent.Object;if(P&&P!==Object){const r=new P();for(const k in o)r[k]=o[k];return r}}catch(e){}return o};\n const getDb=()=>{try{return window.parent&&window.parent!==window&&window.parent.uktDb?window.parent.uktDb():null}catch(e){return null}};\n const sigW=st=>J(WK.map(k=>(st[k]||[]).map(x=>x.id+J(x)).sort()))+(ADM?J(st.info||{})+(st.logo||\"\"):\"\");\n const sigA=st=>J(KEYS.map(k=>(st[k]||[]).map(x=>x.id+J(x)).sort()))+J(st.info||{})+(st.logo||\"\");\n const prep=st=>Object.assign({},st,{up:(st.up||[]).map(u=>u.fileData&&u.fileData.length>400000?Object.assign({},u,{fileData:\"\"}):u)});\n function local(){const g=api.get(),L={data:g.data||[],dojos:g.dojos||[],keluar:g.keluar||[],req:g.req||[],up:g.up||[],riwayat:g.riwayat||[],info:g.info||{},logo:ls(\"karate_logo\")||\"\"};KEYS.forEach(k=>L[k].forEach(x=>{if(!x.id)x.id=nid()}));return L}\n async function read(){step=\"membaca \"+P+\"meta\";const m=await meta().get();if(!m.exists)return null;const d=m.data(),n=d.n||0;let s=\"\";\n  if(n){step=\"membaca \"+rng(n);const qs=await Promise.all(Array.from({length:n},(_,i)=>ref().doc(P+\"c\"+i).get()));for(const q of qs){if(!q.exists)throw new Error(\"potongan data hilang\");s+=q.data().t}}\n  return{rev:d.rev||0,n,st:Object.assign(empty(),s?JSON.parse(s):{})}}\n // gabung tiga arah: B = terakhir tersinkron, L = lokal, R = isi database sekarang\n function merge(B,L,R){const out=Object.assign({},R);\n  KEYS.forEach(k=>{let arr=(R[k]||[]).slice();\n   if(WK.includes(k)){const bm=new Map((B[k]||[]).map(x=>[x.id,J(x)])),lm=new Set((L[k]||[]).map(x=>x.id)),pos=new Map();arr.forEach((x,i)=>pos.set(x.id,i));\n    (L[k]||[]).forEach(x=>{if(bm.get(x.id)!==J(x)){if(pos.has(x.id))arr[pos.get(x.id)]=x;else{pos.set(x.id,arr.length);arr.push(x)}}});\n    const del=new Set((B[k]||[]).filter(x=>!lm.has(x.id)).map(x=>x.id));if(del.size)arr=arr.filter(x=>!del.has(x.id))}\n   out[k]=arr});\n  if(ADM){const inf=Object.assign({},R.info||{}),bi=B.info||{},li=L.info||{};Object.keys(li).forEach(k=>{if(J(li[k])!==J(bi[k]))inf[k]=li[k]});Object.keys(bi).forEach(k=>{if(!(k in li))delete inf[k]});out.info=inf;if((L.logo||\"\")!==(B.logo||\"\"))out.logo=L.logo}\n  return out}\n function show(st){api.set(st,true);if(st.logo&&st.logo!==ls(\"karate_logo\")){ls(\"karate_logo\",st.logo);api.logo(st.logo)}}\n function dirty(){if(!ready||!base)return false;return sigW(local())!==sigW(base)}\n function queue(){ls(\"karate_dirty\",\"1\");clearTimeout(timer);badge(\"Menyimpan…\",\"busy\");timer=setTimeout(flush,600)}\n async function push(){\n  for(let t=0;t\u003c6;t++){\n   step=\"membaca \"+P+\"meta\";const L=local(),mr=await meta().get(),cd=mr.exists?mr.data():{rev:0,n:0};\n   let R=base;if((cd.rev||0)!==baseRev){const r=await read();R=r?r.st:empty()}\n   const M=merge(base,L,R);\n   if(sigW(M)===sigW(R)){base=cl(R);baseRev=cd.rev||0;if(sigA(R)!==sigA(L))show(cl(R));return true}\n   const str=J(prep(M));step=\"menyimpan ke \"+P+\"meta dan data UKT\";big(str);const parts=chunks(str);step=\"menyimpan ke \"+P+\"meta dan \"+rng(parts.length);\n   const ok=await db.runTransaction(async tx=>{const c=await tx.get(meta()),r=c.exists?(c.data().rev||0):0;if(r!==(cd.rev||0))return false;\n    parts.forEach((x,i)=>tx.set(ref().doc(P+\"c\"+i),po({t:x})));for(let i=parts.length;i\u003c(cd.n||0);i++)tx.delete(ref().doc(P+\"c\"+i));\n    tx.set(meta(),po({rev:r+1,n:parts.length,by,at:stamp()}));return true});\n   if(ok){base=cl(M);baseRev=(cd.rev||0)+1;if(sigA(M)!==sigA(L))show(cl(M));return true}}\n  throw new Error(\"terlalu banyak bentrokan penyimpanan\")}\n function okb(){wait=10000;step=\"\";badge(ADM?\"Tersimpan di database Dojoku\":\"Terhubung (mode tamu)\",\"ok\")}\n function fail(e){console.error(e);const c=(e&&e.code)||\"\",m=String((e&&e.message)||e),at=step?\" saat \"+step:\"\";let t;\n   if(c==\"permission-denied\")t=\"Ditolak aturan Firestore\"+at+\". Perbarui Rules di Firebase agar dokumen ukt_meta dan ukt_c* diizinkan (ketuk untuk coba lagi)\";\n   else if(c==\"resource-exhausted\")t=\"Kuota Firestore habis atau data terlalu besar\"+at+\" (ketuk untuk coba lagi)\";\n   else if(c==\"invalid-argument\")t=\"Data ditolak Firestore\"+at+\": \"+m.slice(0,90);\n   else if(c==\"unavailable\")t=\"Tidak bisa menjangkau Firestore (offline?), mencoba lagi… (ketuk untuk coba sekarang)\";\n   else t=\"Gagal sinkron (\"+(c||m.slice(0,60))+\")\"+at+\", mencoba lagi… (ketuk untuk coba sekarang)\";\n   badge(t,\"err\",(c?c+\": \":\"\")+m);clearTimeout(retry);retry=setTimeout(retryNow,wait);wait=Math.min(wait*2,60000)}\n  // coba lagi sekarang (otomatis tiap 10 detik, makin jarang sampai 1 menit; atau ketuk lencana status)\n  function retryNow(){clearTimeout(retry);if(!db||going||running)return;if(ready){listen();return dirty()?flush():pull()}return go()}\n  function listen(){if(unsub||!ready)return;unsub=meta().onSnapshot(s=>{if(!s.exists)return;const d=s.data();if(d.by===by)return;if((d.rev||0)>baseRev)pull()},e=>{unsub=null;step=\"memantau \"+P+\"meta\";fail(e)})}\n  function flush(){clearTimeout(timer);if(!db||!ready)return Promise.resolve();if(running)return running.then(()=>flush());\n  running=(async()=>{try{badge(\"Menyimpan…\",\"busy\");await push();if(!dirty())ls(\"karate_dirty\",null);okb();return true}catch(e){fail(e);return false}finally{running=null}})();return running}\n async function pull(){if(!ready||running)return;if(dirty())return flush();try{const r=await read();if(!r)return;if(r.rev===baseRev)return;base=cl(r.st);baseRev=r.rev;show(cl(r.st));okb()}catch(e){fail(e)}}\n async function sync(){const r=await read(),R=r?r.st:empty(),L=local();let M=R;\n  if(ADM&&(!r||!ls(\"karate_synced\")||ls(\"karate_dirty\")))M=merge(empty(),L,R); // pertama kali / ada perubahan offline: gabungkan data perangkat ini\n  base=cl(R);baseRev=r?r.rev:0;ready=true;show(cl(M));if(ADM)ls(\"karate_synced\",\"1\");\n  if(ADM&&sigW(M)!==sigW(R))await flush();else okb()}\n async function go(){if(going)return;going=true;try{badge(\"Memuat dari database…\",\"busy\");await sync();listen();\n    if(!vis){vis=true;document.addEventListener(\"visibilitychange\",()=>{if(!document.hidden)pull()})}}catch(e){fail(e)}finally{going=false}}\n  function start(a){api=a;api.access(ADM);if(ADM)api.profile({nama:\"Pengurus pusat\",username:\"pengurus\",email:\"\",foto:\"\"});\n  badge(\"Menghubungkan ke database…\",\"busy\");const bd=$(\"cloudBadge\");if(bd){bd.style.cursor=\"pointer\";bd.addEventListener(\"click\",()=>retryNow())}\n   const why=()=>{try{const e=window.parent.uktDbErr&&window.parent.uktDbErr();return e?\" (\"+e+\")\":\"\"}catch(x){return\"\"}};\n   let n=0;(function tryc(){db=getDb();if(db){go();return}n++;if(n==40)badge(\"Mode lokal: Firebase Dojoku belum tersambung\"+why()+\". Data tersimpan di perangkat ini\",\"err\");setTimeout(tryc,n\u003c40?500:10000)})()}\n const na=()=>Promise.resolve(\"Tidak tersedia: akses diatur dari aplikasi Dojoku.\");\n return{start,queue,flush,dirty,retryNow,setLogo:()=>{if(ADM&&ready)queue()},login:na,logout:()=>{},reqReady:()=>true,upReady:()=>true,saveProfile:na,saveFoto:na,changeEmail:na,changePassword:na}\n})();\nwindow.Cloud=Cloud;\n\u003c/script>\n\u003cscript>\nconst $=id=>document.getElementById(id);\nconst fmtLahir=t=>/^\\d{4}-\\d{2}-\\d{2}$/.test(t||\"\")?new Date(t+\"T12:00:00\").toLocaleDateString(\"id-ID\",{day:\"numeric\",month:\"long\",year:\"numeric\"}):(t||\"\");\nconst ttl=p=>[p.tmp,fmtLahir(p.tgl)].filter(Boolean).join(\", \");\nconst rp=n=>\"Rp \"+(Number(n)||0).toLocaleString(\"id-ID\");\nlet data=[],info={},dojos=[],keluar=[],hapusReq=[],uploads=[],riwayat=[],editId=null,editDojo=null,editK=null;\nconst findDojo=n=>dojos.find(d=>d.nama.toLowerCase()===String(n||\"\").trim().toLowerCase());\nfunction load(){try{data=JSON.parse(localStorage.getItem(\"karate_data\")||\"[]\");info=JSON.parse(localStorage.getItem(\"karate_info\")||\"{}\");dojos=JSON.parse(localStorage.getItem(\"karate_dojo\")||\"[]\");keluar=JSON.parse(localStorage.getItem(\"karate_keluar\")||\"[]\");hapusReq=JSON.parse(localStorage.getItem(\"karate_req\")||\"[]\");uploads=JSON.parse(localStorage.getItem(\"karate_up\")||\"[]\");riwayat=JSON.parse(localStorage.getItem(\"karate_riwayat\")||\"[]\")}catch(e){data=[];info={};dojos=[];keluar=[];hapusReq=[];uploads=[];riwayat=[]}}\nfunction save(){try{stampKw()}catch(e){}saveLocal();if(window.Cloud)Cloud.queue()}\n/* Saat dojo berstatus Lunas, cap nomor dan tanggal kwitansi pada data dojo (dojos[].kw). Akun dojo membaca cap ini untuk menerima kwitansi dan berita acara otomatis. Status kembali Belum: cap dihapus. */\nfunction stampKw(){if(window.UKT_MODE!==\"a\")return;const now=new Date(),iso=now.toISOString().slice(0,10),ymd=iso.replace(/-/g,\"\");\n let seq=dojos.reduce((m,d)=>Math.max(m,(d.kw&&d.kw.seq)||0),0);\n dojos.forEach(d=>{if(d.status===\"Lunas\"){if(!d.kw){seq++;d.kw={no:\"KW/\"+ymd+\"/\"+String(seq).padStart(3,\"0\"),seq:seq,tgl:iso,ts:now.toISOString()}}}else if(d.kw)delete d.kw})}\nif(window.UKT_MODE===\"a\")setTimeout(function(){setInterval(function(){try{if(dojos.some(function(d){return d.status===\"Lunas\"&&!d.kw}))save()}catch(e){}},30000)},25000);\nfunction saveLocal(){try{localStorage.setItem(\"karate_data\",JSON.stringify(data));localStorage.setItem(\"karate_info\",JSON.stringify(info));localStorage.setItem(\"karate_dojo\",JSON.stringify(dojos));localStorage.setItem(\"karate_keluar\",JSON.stringify(keluar));localStorage.setItem(\"karate_req\",JSON.stringify(hapusReq))}catch(e){}try{localStorage.setItem(\"karate_up\",JSON.stringify(uploads))}catch(e){try{localStorage.removeItem(\"karate_up\")}catch(x){}}try{localStorage.setItem(\"karate_riwayat\",JSON.stringify(riwayat))}catch(e){try{localStorage.removeItem(\"karate_riwayat\")}catch(x){}}}\nconst esc=s=>String(s??\"\").replace(/[&\u003c>\"]/g,c=>({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\"}[c]));\nconst fee=(p,k)=>{const d=findDojo(p.dojo);return d?(+d[k]||0):0};\nconst tot=p=>fee(p,\"ujian\");\nconst lunas=p=>{const d=findDojo(p.dojo);return !!d&&d.status===\"Lunas\"};\n\n// ===== Permintaan hapus peserta =====\nconst pendReq=id=>hapusReq.some(r=>r.pid===id&&r.status===\"menunggu\");\nconst delBtn=p=>logged?'\u003cbutton class=\"s\" data-d=\"'+p.id+'\">Hapus\u003c/button>':(pendReq(p.id)?'\u003cspan class=\"b u\">Menunggu admin\u003c/span>':'\u003cbutton class=\"s\" data-r=\"'+p.id+'\">Ajukan hapus\u003c/button>');\nconst fWaktu=t=>t?new Date(t).toLocaleString(\"id-ID\",{day:\"numeric\",month:\"short\",year:\"numeric\",hour:\"2-digit\",minute:\"2-digit\"}):\"\";\nfunction renderNot(){\n const pend=hapusReq.filter(r=>r.status===\"menunggu\").sort((a,b)=>(a.tgl||\"\").localeCompare(b.tgl||\"\"));\n const b=$(\"nBadge\");b.textContent=pend.length;b.hidden=!pend.length;\n $(\"nList\").innerHTML=pend.length?pend.map(r=>{const q=data.find(x=>x.id===r.pid);return `\u003cdiv class=\"rq\">\u003cdiv>\u003cb>${esc(r.nama)}\u003c/b> \u003cspan class=\"hint\">${esc(r.dojo)}${r.ke?\" | \"+esc(r.ke):\"\"}\u003c/span>\u003cbr>\u0 const UKS={busy:false,again:false,timer:0,err:'',dup:0,at:0};

async function ukCloud(fn){const db=window.uktDb();if(!db)throw new Error('database belum tersambung');

  if(cd.n){const qs=await Promise.all(Array.from({length:cd.n},(_,i)=>ref.doc('ukt_c'+i).get()));let s='';for(const q of qs){if(!q.exists)throw new Error('potongan data UKT hilang');s+=q.data().t}if(s)st=Object.assign(st,JSON.parse(s))}

function ukdTb(n){n=Math.floor(Math.abs(n));const a=['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
 const f=n=>{if(n<12)return a[n];if(n<20)return f(n-10)+' belas';if(n<100)return f(Math.floor(n/10))+' puluh '+f(n%10);if(n<200)return 'seratus '+f(n-100);if(n<1000)return f(Math.floor(n/100))+' ratus '+f(n%100);if(n<2000)return 'seribu '+f(n-1000);if(n<1e6)return f(Math.floor(n/1e3))+' ribu '+f(n%1000);if(n<1e9)return f(Math.floor(n/1e6))+' juta '+f(n%1e6);return f(Math.floor(n/1e9))+' miliar '+f(n%1e9)};
